[workspace]
# `cargo:.` is the Cargo workspace (hippius-mem + hippius-mem-core);
# `dist:dist-lean` is a generic (build-command) app that exists ONLY because
# cargo-dist has no per-target Cargo-feature config: x86_64 macOS cannot build
# the `embeddings` feature (ONNX Runtime >= 1.24 dropped that platform), so it
# ships as a separate, clearly-named lean app. See dist-lean/dist.toml.
members = ["cargo:.", "dist:dist-lean"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Supply-chain gate (cargo-deny), expressed dist-natively so `dist generate`
# round-trips it: "./cargo-deny" wires .github/workflows/cargo-deny.yml
# (workflow_call) into the generated release.yml as `custom-cargo-deny`. This
# replaced a hand-added deny job + `needs: [deny]` on plan, which regeneration
# silently deleted, and the allow-dirty = ["ci"] escape hatch that hid the
# drift by disabling dist's release.yml freshness check.
# The slot is deliberate (verified against cargo-dist v0.32.0's
# templates/ci/github/release.yml.j2):
#   - local-artifacts-jobs is the ONLY custom-job slot whose FAILURE blocks
#     publishing: `host` — the job that runs `gh release create` against the
#     public releases repo — both `needs` the custom job and requires
#     `result == 'skipped' || 'success'` in its `if:`, so a failing check
#     skips host, the homebrew publish, and announce: nothing is published.
#     build-global-artifacts also `needs` it, so installers/checksums are
#     never built either.
#   - plan-jobs looks stronger (its failure skips the builds) but is WEAKER:
#     host neither needs nor tests plan-jobs, tolerates SKIPPED builds
#     (`always() && (result == 'skipped' || 'success')`), and `dist host` is a
#     no-op for GitHub hosting — so a failed plan-job still ends in
#     `gh release create` publishing an EMPTY public release.
# Trade accepted: the platform builds run in parallel with the check and are
# wasted work when it fails. The generated caller's guard is
# `if: needs.plan.outputs.publishing == 'true' || pr_run_mode == 'upload'` —
# so with our default pr-run-mode (`plan`) it fires only on tag pushes, but
# enabling `pr-run-mode = "upload"` would (safely — extra coverage, never a
# bypass) run it on every PR too. PR coverage stays with rust.yml's required
# `deny` check. Keep cargo-deny.yml's pins in lockstep with rust.yml.
local-artifacts-jobs = ["./cargo-deny"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Homebrew tap to publish formulas to (Task 1.2 created the repo).
tap = "thenervelab/homebrew-tap"
# Publish the homebrew formula to the tap above on release.
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# x86_64-apple-darwin is intentionally NOT here: it is covered by the
# `hippius-mem-lean` generic app (dist-lean/dist.toml), which overrides this
# package-local setting, because the `embeddings` feature cannot build there.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# --- Release hosting: prebuilts on thenervelab/hippius-mem-releases ---
# Source lives in this public repo; cargo-dist still publishes GitHub Release
# artifacts to a dedicated releases repo so install.sh can fetch a stable
# prebuilt URL independent of source tags. Requires:
#   1. the public repo below to exist with at least one commit (dist tags its
#      default-branch HEAD), and
#   2. a PAT with `repo` scope on it stored as the `GH_RELEASES_TOKEN` secret
#      in thenervelab/hippius-mem.
github-releases-repo = "thenervelab/hippius-mem-releases"
# Keep dist from uploading a second source tarball onto the releases repo
# (the source of truth is this repository). GitHub's auto-generated tarball
# link on a release of *this* repo is the checkout at the tag.
source-tarball = false

[dist.github-custom-runners]
# Native arm64 build instead of dist's default (cargo-zigbuild cross-compile
# from ubuntu-22.04): the `embeddings` feature statically links the prebuilt
# ONNX Runtime C++ library, and linking a gcc/libstdc++ static archive through
# zig's clang/libc++ toolchain is exactly the kind of cross-link that breaks.
# `ubuntu-24.04-arm` is a standard GitHub-hosted runner label, available for
# private repos (billed minutes) per GitHub's hosted-runner docs.
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

[dist.github-action-commits]
# Supply-chain hardening: pin every third-party action in the generated
# workflow to a full commit SHA. dist re-applies these pins on every
# `dist generate`, so they survive regeneration — the config knob is preferred
# over hand-editing release.yml, which dist owns and overwrites.
# Tag->SHA mappings verified against each repo's git refs on 2026-07-12:
"actions/checkout" = "df4cb1c069e1874edd31b4311f1884172cec0e10"           # v6.0.3
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"    # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"  # v8.0.1

[dist.github-custom-job-permissions]
# Narrow release.yml's workflow-level `contents: write` (which dist needs to
# publish releases) to read-only on the generated `custom-cargo-deny` caller
# job — the gate only reads the tree. The called workflow's own job narrows
# again in-file as defense in depth. Workspace-level knob; dist re-applies it
# on every `dist generate`, like the action pins above.
cargo-deny = { contents = "read" }

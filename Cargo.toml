[workspace]
members = ["hippius-mem-core", "hippius-mem"]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
mem_forget = "deny"
exit = "deny"
allow_attributes = "deny"
module_name_repetitions = "allow"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

# Release-artifact profile: thin LTO trims the shipped binary (the embeddings
# build statically links ONNX Runtime) at acceptable CI cost. dist builds with
# `--profile dist` in CI and dist-lean/build.sh MUST use the same profile so
# all four released artifacts are built identically.
[profile.dist]
inherits = "release"
lto = "thin"

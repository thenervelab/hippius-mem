<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hippius Memory — Team Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-soft: rgba(15, 23, 42, 0.5);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --blue: #38bdf8;
            --emerald: #10b981;
            --amber: #f59e0b;
            --violet: #a78bfa;
            --slate: #64748b;
            --red: #ef4444;
            --border: rgba(71, 85, 105, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem 5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            margin: 0;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, var(--blue), var(--emerald));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            margin: 0.4rem 0 0;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .badges { display: flex; gap: 0.5rem; align-items: center; }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            border: 1px solid transparent;
        }
        .badge-semantic { background: rgba(16, 185, 129, 0.12); color: var(--emerald); border-color: rgba(16, 185, 129, 0.3); }
        .badge-lexical { background: rgba(245, 158, 11, 0.12); color: var(--amber); border-color: rgba(245, 158, 11, 0.3); }

        .error-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .health-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.875rem 1.25rem;
            margin-bottom: 1.5rem;
        }
        .health-item { display: flex; flex-direction: column; }
        .health-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }
        .health-value {
            font-size: 0.9rem;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .filters input {
            background: var(--card-soft);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            outline: none;
        }
        .filters input:focus { border-color: var(--blue); }
        .filters input#f-q { flex: 1 1 220px; }
        .filters input#f-type, .filters input#f-repo, .filters input#f-tag { flex: 0 1 150px; }
        .filters button {
            background: #334155;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .filters button:hover { background: #475569; color: var(--text); }

        .notes-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .notes-table th {
            text-align: left;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        .notes-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(71, 85, 105, 0.2);
            font-size: 0.875rem;
            vertical-align: top;
        }
        .note-row { cursor: pointer; transition: background 0.15s; }
        .note-row:hover { background: rgba(56, 189, 248, 0.06); }
        .note-row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; background: rgba(56, 189, 248, 0.06); }
        .note-row:last-child td { border-bottom: none; }
        .col-summary { max-width: 420px; }
        .col-repo, .col-updated { color: var(--text-dim); white-space: nowrap; font-family: ui-monospace, monospace; font-size: 0.8rem; }
        .col-tags { min-width: 8rem; }

        .chip {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
            background: rgba(100, 116, 139, 0.15);
            color: var(--slate);
            border: 1px solid rgba(100, 116, 139, 0.3);
            white-space: nowrap;
        }
        .chip-decision { background: rgba(56, 189, 248, 0.12); color: var(--blue); border-color: rgba(56, 189, 248, 0.3); }
        .chip-gotcha { background: rgba(245, 158, 11, 0.12); color: var(--amber); border-color: rgba(245, 158, 11, 0.3); }
        .chip-convention { background: rgba(16, 185, 129, 0.12); color: var(--emerald); border-color: rgba(16, 185, 129, 0.3); }
        .chip-reference { background: rgba(167, 139, 250, 0.12); color: var(--violet); border-color: rgba(167, 139, 250, 0.3); }
        .chip-context { background: rgba(148, 163, 184, 0.12); color: var(--text-dim); border-color: rgba(148, 163, 184, 0.3); }

        .tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
        .tag {
            font-size: 0.65rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .empty {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-dim);
            font-size: 0.9rem;
            background: var(--card-soft);
            border: 2px dashed var(--border);
            border-radius: 0.75rem;
            margin-top: 1rem;
        }

        /* Detail drawer */
        .scrim {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(3px);
            z-index: 900;
        }
        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: min(560px, 92vw);
            background: var(--card);
            border-left: 1px solid var(--border);
            box-shadow: -20px 0 40px -12px rgba(0, 0, 0, 0.5);
            transform: translateX(100%);
            transition: transform 0.25s ease;
            z-index: 1000;
            overflow-y: auto;
        }
        .drawer.open { transform: translateX(0); }
        .drawer-inner { padding: 1.75rem; position: relative; }
        .drawer-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 2rem;
            height: 2rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
        }
        .drawer-close:hover { background: #334155; color: var(--text); }

        .d-type { margin-bottom: 0.75rem; }
        .d-summary { font-size: 1.35rem; font-weight: 800; margin: 0 2rem 1.25rem 0; letter-spacing: -0.02em; }
        .d-meta {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.4rem 1rem;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }
        .d-meta-k { color: var(--text-dim); font-weight: 600; }
        .d-meta-v { font-family: ui-monospace, monospace; word-break: break-all; }

        .d-section { margin-bottom: 1.5rem; }
        .d-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }
        .d-body {
            background: var(--card-soft);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.875rem;
            font-size: 0.85rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
        .d-links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; }
        .d-links li {
            font-family: ui-monospace, monospace;
            font-size: 0.75rem;
            color: var(--blue);
            word-break: break-all;
        }
        .d-muted { color: var(--slate); font-style: italic; font-size: 0.8rem; }

        .d-history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
        .hist-entry {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.75rem;
            padding: 0.5rem 0.625rem;
            background: var(--card-soft);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
        }
        .hist-kind {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.03em;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            background: rgba(100, 116, 139, 0.15);
        }
        .hist-author { font-family: ui-monospace, monospace; color: var(--text-dim); word-break: break-all; }
        .hist-lamport { color: var(--slate); }
        .hist-anchor { margin-left: auto; font-weight: 600; }
        .hist-anchor.anchored { color: var(--emerald); }
        .hist-anchor.pending { color: var(--amber); }

        .drawer-loading, .drawer-notfound, .drawer-error { padding: 2rem 0; color: var(--text-dim); font-size: 0.9rem; }
        .drawer-notfound { color: var(--amber); }
        .drawer-error { color: #fca5a5; }

        footer {
            margin-top: 4rem;
            text-align: center;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--slate);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Hippius Memory</h1>
                <p id="subtitle" class="subtitle">Loading team memory…</p>
            </div>
            <div id="mode-badges" class="badges"></div>
        </header>

        <div id="error-banner" class="error-banner" hidden></div>

        <section id="health-strip" class="health-strip"></section>

        <section class="filters">
            <input id="f-q" type="search" aria-label="Search notes" placeholder="Search notes…" autocomplete="off" spellcheck="false">
            <input id="f-type" type="text" aria-label="Filter by note type" placeholder="type (e.g. gotcha)" autocomplete="off" spellcheck="false">
            <input id="f-repo" type="text" aria-label="Filter by repo" placeholder="repo (e.g. global)" autocomplete="off" spellcheck="false">
            <input id="f-tag" type="text" aria-label="Filter by tag" placeholder="tag" autocomplete="off" spellcheck="false">
            <button id="f-clear" type="button">Clear</button>
        </section>

        <table id="notes-table" class="notes-table">
            <thead>
                <tr>
                    <th>Summary</th>
                    <th>Type</th>
                    <th>Repo</th>
                    <th>Updated</th>
                    <th>Tags</th>
                </tr>
            </thead>
            <tbody id="notes-tbody"></tbody>
        </table>
        <div id="notes-empty" class="empty" hidden>No notes match the current filters.</div>

        <footer>Hippius Team Memory · loopback dashboard</footer>
    </div>

    <div id="drawer-scrim" class="scrim" hidden></div>
    <aside id="drawer" class="drawer" aria-hidden="true">
        <div class="drawer-inner">
            <button id="drawer-close" class="drawer-close" type="button" aria-label="Close">×</button>
            <div id="drawer-body"></div>
        </div>
    </aside>

    <script>
        "use strict";

        // The launch token lives in THIS page's own URL (?t=…), placed there by the
        // CLI when it printed the dashboard link. Every API call must re-present it:
        // the server gates all routes and returns 401 without it. We read it once at
        // load; a missing token is surfaced immediately rather than after a failed
        // fetch, so the page is never silently blank.
        const TOKEN = new URLSearchParams(location.search).get("t") || "";

        const byId = (id) => document.getElementById(id);

        // Build a DOM node with attributes/children. `text` sets textContent, so any
        // caller-supplied string (note summaries, bodies, tags, ids) is inserted as a
        // text node — never parsed as HTML. This is the XSS boundary: note content is
        // arbitrary team text and must never reach innerHTML.
        function el(tag, props, ...children) {
            const node = document.createElement(tag);
            if (props) {
                for (const [k, v] of Object.entries(props)) {
                    if (k === "class") node.className = v;
                    else if (k === "text") node.textContent = v;
                    else node.setAttribute(k, v);
                }
            }
            for (const child of children) {
                if (child == null) continue;
                node.append(child); // strings become text nodes — safe by construction
            }
            return node;
        }

        // Compose an API URL carrying the token plus any non-empty filter params.
        // Empty values are OMITTED so a cleared filter input does not send `type=`
        // (which the backend would treat as "match the empty type" — i.e. nothing).
        function apiUrl(path, params) {
            const url = new URL(path, location.origin);
            url.searchParams.set("t", TOKEN);
            if (params) {
                for (const [k, v] of Object.entries(params)) {
                    if (v) url.searchParams.set(k, v);
                }
            }
            return url.toString();
        }

        // GET + parse JSON, throwing a status-tagged error on any non-200 so callers
        // can branch on `e.status` (401 → token message, 404 → not-found). The store's
        // `{ "error": … }` detail, when present, is attached for display.
        async function apiGet(path, params) {
            let res;
            try {
                res = await fetch(apiUrl(path, params));
            } catch (netErr) {
                throw { status: 0, message: netErr.message };
            }
            if (!res.ok) {
                let detail = "";
                try {
                    const j = await res.json();
                    detail = (j && j.error) || "";
                } catch (_) { /* body was not JSON — leave detail empty */ }
                throw { status: res.status, detail };
            }
            return res.json();
        }

        function errorText(e) {
            if (e.status === 401) return "missing/invalid token — reopen the URL the CLI printed";
            if (e.status === 404) return "not found";
            const detail = e.detail ? ": " + e.detail : (e.message ? ": " + e.message : "");
            if (e.status) return "error " + e.status + detail;
            return "network error" + detail;
        }

        function showError(e) {
            const banner = byId("error-banner");
            banner.textContent = errorText(e);
            banner.hidden = false;
        }
        function clearError() {
            const banner = byId("error-banner");
            banner.hidden = true;
            banner.textContent = "";
        }

        function fmtDate(ms) {
            const n = Number(ms);
            if (!n) return "—";
            const d = new Date(n);
            return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString();
        }

        function typeChip(t) {
            return el("span", { class: "chip chip-" + (t || "unknown"), text: t || "—" });
        }

        function tagList(tags) {
            const wrap = el("span", { class: "tags" });
            for (const t of tags || []) wrap.append(el("span", { class: "tag", text: t }));
            return wrap;
        }

        function modeBadge(semantic) {
            return el("span", {
                class: "badge " + (semantic ? "badge-semantic" : "badge-lexical"),
                text: semantic ? "semantic" : "lexical",
            });
        }

        function renderHeader(ov) {
            const count = ov.note_count || 0;
            byId("subtitle").textContent =
                count + " note" + (count === 1 ? "" : "s") + " · team " + ov.team;
            byId("mode-badges").replaceChildren(modeBadge(ov.semantic));
        }

        function healthItem(label, value) {
            return el("div", { class: "health-item" },
                el("span", { class: "health-label", text: label }),
                el("span", { class: "health-value", text: value }));
        }

        function renderHealth(h) {
            byId("health-strip").replaceChildren(
                healthItem("Team", h.team),
                healthItem("Mode", h.semantic ? "semantic" : "lexical"),
                healthItem("Last refresh", h.synced ? "synced now" : "already fresh"),
                healthItem("Notes", String(h.note_count)));
        }

        function renderNotes(notes) {
            const tbody = byId("notes-tbody");
            tbody.replaceChildren();
            byId("notes-empty").hidden = notes.length > 0;
            for (const n of notes) {
                // role=button + tabindex make the <tr> a focusable, announced control
                // (a bare table row is neither), so keyboard users reach and activate
                // it. Enter/Space mirror the click; Space is preventDefault'd so it
                // opens the drawer instead of scrolling the page.
                const row = el("tr", {
                    class: "note-row", role: "button", tabindex: "0",
                    "aria-label": "Open note: " + n.summary,
                },
                    el("td", { class: "col-summary", text: n.summary }),
                    el("td", null, typeChip(n.note_type)),
                    el("td", { class: "col-repo", text: n.repo }),
                    el("td", { class: "col-updated", text: fmtDate(n.updated) }),
                    el("td", { class: "col-tags" }, tagList(n.tags)));
                row.addEventListener("click", () => openDetail(n.id, row));
                row.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        openDetail(n.id, row);
                    }
                });
                tbody.append(row);
            }
        }

        // --- Detail drawer -------------------------------------------------------

        // The element that opened the drawer, so focus returns there on close — a
        // keyboard user is not dumped back at the top of the document.
        let drawerOpener = null;

        function openDrawer() {
            byId("drawer").classList.add("open");
            byId("drawer").setAttribute("aria-hidden", "false");
            byId("drawer-scrim").hidden = false;
            byId("drawer-close").focus(); // move focus into the drawer
        }
        function closeDrawer() {
            byId("drawer").classList.remove("open");
            byId("drawer").setAttribute("aria-hidden", "true");
            byId("drawer-scrim").hidden = true;
            if (drawerOpener && drawerOpener.isConnected) drawerOpener.focus();
            drawerOpener = null;
        }

        async function openDetail(id, opener) {
            drawerOpener = opener || null;
            const body = byId("drawer-body");
            body.replaceChildren(el("div", { class: "drawer-loading", text: "Loading…" }));
            openDrawer();
            try {
                const detail = await apiGet("/api/notes/" + encodeURIComponent(id));
                renderDetail(detail);
            } catch (e) {
                const cls = e.status === 404 ? "drawer-notfound" : "drawer-error";
                body.replaceChildren(el("div", { class: cls, text: errorText(e) }));
            }
        }

        function metaGrid(d) {
            const grid = el("div", { class: "d-meta" });
            const rows = [
                ["ID", d.id],
                ["Repo", d.repo],
                ["Author", d.author],
                ["Version", (d.version || "").slice(0, 12)], // short hex prefix
                ["Created", fmtDate(d.created)],
                ["Updated", fmtDate(d.updated)],
            ];
            for (const [k, v] of rows) {
                grid.append(
                    el("span", { class: "d-meta-k", text: k }),
                    el("span", { class: "d-meta-v", text: v || "—" }));
            }
            return grid;
        }

        function linksSection(label, links) {
            const list = el("ul", { class: "d-links" });
            for (const l of links) list.append(el("li", { text: l }));
            return el("div", { class: "d-section" },
                el("div", { class: "d-label", text: label }), list);
        }

        function historySection(h) {
            const flags = [];
            if (h.tombstoned) flags.push("tombstoned");
            if (h.redacted) flags.push("redacted");
            const label = "History" + (flags.length ? " (" + flags.join(", ") + ")" : "");
            const sec = el("div", { class: "d-section" }, el("div", { class: "d-label", text: label }));
            const entries = h.entries || [];
            if (!entries.length) {
                sec.append(el("div", { class: "d-muted", text: "No recorded ops." }));
                return sec;
            }
            const list = el("ul", { class: "d-history" });
            for (const e of entries) {
                list.append(el("li", { class: "hist-entry" },
                    el("span", { class: "hist-kind", text: e.kind }),
                    el("span", { class: "hist-author", text: e.author }),
                    el("span", { class: "hist-lamport", text: "lamport " + e.lamport }),
                    el("span", {
                        class: "hist-anchor " + (e.anchored ? "anchored" : "pending"),
                        text: e.anchored ? "anchored" : "pending",
                    })));
            }
            sec.append(list);
            return sec;
        }

        function renderDetail(d) {
            const parts = [
                el("div", { class: "d-type" }, typeChip(d.note_type)),
                el("h2", { class: "d-summary", text: d.summary }),
                metaGrid(d),
            ];
            if (d.tags && d.tags.length) {
                parts.push(el("div", { class: "d-section" },
                    el("div", { class: "d-label", text: "Tags" }), tagList(d.tags)));
            }
            parts.push(el("div", { class: "d-section" },
                el("div", { class: "d-label", text: "Body" }),
                el("pre", { class: "d-body", text: d.body })));
            if (d.links && d.links.length) parts.push(linksSection("Links", d.links));
            if (d.history) parts.push(historySection(d.history));
            byId("drawer-body").replaceChildren(...parts);
        }

        // --- Filters + load ------------------------------------------------------

        function currentFilters() {
            return {
                q: byId("f-q").value.trim(),
                type: byId("f-type").value.trim(),
                repo: byId("f-repo").value.trim(),
                tag: byId("f-tag").value.trim(),
            };
        }

        // Debounce keystrokes so a fast typist issues one request, not one per key.
        const FILTER_DEBOUNCE_MS = 200;
        let filterTimer = null;
        function onFilterChange() {
            clearTimeout(filterTimer);
            filterTimer = setTimeout(refreshNotes, FILTER_DEBOUNCE_MS);
        }

        async function refreshNotes() {
            // Known Phase 1 limitation: no generation guard on the notes table. A slow
            // `/api/overview` (page load) resolving AFTER a fast filtered `/api/notes`
            // can clobber the filtered view with the unfiltered list, and two rapid
            // filter requests can land out of order. Acceptable for a loopback,
            // single-user surface; a request-generation token is a later phase.
            try {
                const data = await apiGet("/api/notes", currentFilters());
                renderNotes(data.notes || []);
                clearError();
            } catch (e) {
                showError(e);
            }
        }

        async function loadOverview() {
            try {
                const ov = await apiGet("/api/overview");
                renderHeader(ov);
                renderNotes(ov.notes || []);
                clearError();
            } catch (e) {
                showError(e);
                byId("subtitle").textContent = "Could not load team memory.";
            }
        }

        async function loadHealth() {
            try {
                renderHealth(await apiGet("/api/health"));
            } catch (e) {
                // Health is a secondary strip; on failure show the reason inline
                // rather than blanking the panel or the whole page.
                byId("health-strip").replaceChildren(healthItem("Health", errorText(e)));
            }
        }

        function init() {
            if (!TOKEN) showError({ status: 401 });

            for (const id of ["f-q", "f-type", "f-repo", "f-tag"]) {
                byId(id).addEventListener("input", onFilterChange);
            }
            byId("f-clear").addEventListener("click", () => {
                // Cancel any pending debounced refresh so clearing fires exactly one
                // request, not a redundant second one from the last keystroke.
                clearTimeout(filterTimer);
                for (const id of ["f-q", "f-type", "f-repo", "f-tag"]) byId(id).value = "";
                refreshNotes();
            });
            byId("drawer-close").addEventListener("click", closeDrawer);
            byId("drawer-scrim").addEventListener("click", closeDrawer);
            document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

            loadOverview();
            loadHealth();
        }

        init();
    </script>
</body>
</html>

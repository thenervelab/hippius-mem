        :root {
            /* Hippius console dark-theme tokens */
            --bg: #161616;
            --surface: #1e1e1e;
            --elevated: #232323;
            --border: #494949;
            --divider: #2a2a2a;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --text-faint: #7d7d7d;
            --brand: #3167DD;
            --brand-hi: #618CE8;
            --success: #32D583;
            --warning: #FEB201;
            --error: #F51A0A;
            --radius-card: 8px;
            --radius-sm: 4px;
            --shadow: 0px 12px 36px 0px rgba(0, 0, 0, 0.24);
            --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            margin: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1320px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 5rem;
        }

        header {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            margin-bottom: 2rem;
        }

        .brand { display: flex; align-items: center; gap: 0.875rem; }

        /* Rounded logo box with a faint blueprint grid behind the mark, echoing the
           console's LogoMark. The radial fade keeps the grid subtle at the centre. */
        .logo-box {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--surface);
            background-image:
                radial-gradient(circle at center, rgba(30, 30, 30, 0) 0%, var(--surface) 85%),
                linear-gradient(to right, rgba(31, 80, 189, 0.35) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(31, 80, 189, 0.35) 1px, transparent 1px);
            background-size: 100% 100%, 8.5px 8.5px, 8.5px 8.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7px;
        }
        .logo-box svg { width: 100%; height: 100%; display: block; }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0.2rem 0 0;
            font-weight: 400;
            font-size: 0.85rem;
        }

        .badges { display: flex; gap: 0.5rem; align-items: center; }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.3rem 0.7rem;
            border-radius: 9999px;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .badge-semantic { background: rgba(50, 213, 131, 0.12); color: var(--success); border-color: rgba(50, 213, 131, 0.35); }
        .badge-lexical { background: rgba(254, 178, 1, 0.12); color: var(--warning); border-color: rgba(254, 178, 1, 0.35); }
        .badge-current { background: rgba(49, 103, 221, 0.18); color: var(--brand-hi); border-color: rgba(49, 103, 221, 0.5); }

        .error-banner {
            background: rgba(245, 26, 10, 0.1);
            border: 1px solid rgba(245, 26, 10, 0.4);
            color: #ff8a80;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        /* ---- View 1: vaults landing ---- */
        .vaults-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.1rem;
        }
        .vault-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 1.25rem 1.35rem;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: background 0.15s, border-color 0.15s;
        }
        .vault-card:hover { background: var(--elevated); border-color: var(--brand); }
        .vault-card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
        .vault-card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        .vault-card-name { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; color: var(--text); word-break: break-word; }
        .vault-card-orgs { font-size: 0.82rem; color: var(--text-muted); }
        .vault-card-bucket { font-size: 0.72rem; color: var(--text-faint); font-family: var(--font-mono); word-break: break-all; }

        /* ---- View 2: vault memory ---- */
        .breadcrumb { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem; }
        .breadcrumb a { color: var(--brand-hi); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .crumb-sep { color: var(--text-faint); margin: 0 0.4rem; }

        .vault-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .vault-head h2 { margin: 0; font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
        .health-line { font-size: 0.75rem; color: var(--text-faint); font-family: var(--font-mono); margin: 0 0 1.5rem; min-height: 1.1rem; }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .filters input {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.55rem 0.8rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-family: var(--font-sans);
            outline: none;
            transition: border-color 0.15s;
        }
        .filters input::placeholder { color: var(--text-faint); }
        .filters input:focus { border-color: var(--brand); }
        .filters input#f-q { flex: 1 1 240px; }
        .filters input#f-type, .filters input#f-tag { flex: 0 1 160px; }
        .filters button {
            background: var(--brand);
            border: 1px solid var(--brand);
            color: #ffffff;
            padding: 0.55rem 1.1rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .filters button:hover { background: var(--brand-hi); border-color: var(--brand-hi); }

        .vault-status {
            padding: 2.5rem 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
        }
        .vault-status.status-error { color: #ff8a80; border-color: rgba(245, 26, 10, 0.4); }
        .vault-status .spinner {
            display: inline-block;
            width: 1rem; height: 1rem;
            margin-right: 0.5rem;
            vertical-align: -2px;
            border: 2px solid var(--border);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Compact accordion list */
        .note-list {
            list-style: none;
            margin: 0;
            padding: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .note-item {
            border-bottom: 1px solid var(--divider);
            cursor: pointer;
            transition: background 0.12s;
        }
        .note-item:last-child { border-bottom: none; }
        .note-item:hover { background: var(--elevated); }
        .note-item:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; background: var(--elevated); }
        .note-item.open { background: var(--elevated); }

        .note-head {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1.1rem;
            min-width: 0;
        }
        .note-summary {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
            font-size: 0.9rem;
        }
        .note-meta {
            flex-shrink: 0;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .note-expand { display: none; padding: 0 1.1rem 1.1rem; }
        .note-item.open .note-expand { display: block; }

        .chip {
            display: inline-block;
            flex-shrink: 0;
            font-size: 0.62rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.22rem 0.6rem;
            border-radius: 9999px;
            background: rgba(160, 160, 160, 0.12);
            color: var(--text-muted);
            border: 1px solid rgba(160, 160, 160, 0.3);
            white-space: nowrap;
        }
        .chip-decision { background: rgba(49, 103, 221, 0.15); color: var(--brand-hi); border-color: rgba(49, 103, 221, 0.4); }
        .chip-gotcha { background: rgba(254, 178, 1, 0.12); color: var(--warning); border-color: rgba(254, 178, 1, 0.35); }
        .chip-convention { background: rgba(50, 213, 131, 0.12); color: var(--success); border-color: rgba(50, 213, 131, 0.35); }
        .chip-reference { background: rgba(97, 140, 232, 0.12); color: var(--brand-hi); border-color: rgba(97, 140, 232, 0.35); }
        .chip-context { background: rgba(160, 160, 160, 0.12); color: var(--text-muted); border-color: rgba(160, 160, 160, 0.3); }

        .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .tag {
            font-size: 0.65rem;
            padding: 0.12rem 0.45rem;
            border-radius: var(--radius-sm);
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .empty {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            margin-top: 1rem;
        }

        /* Expanded-row detail tiers */
        .d-label {
            font-size: 0.62rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-faint);
            margin-bottom: 0.5rem;
        }
        .d-section { margin-bottom: 1.1rem; }
        .d-preview, .d-body {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.8rem;
            font-size: 0.82rem;
            font-family: var(--font-mono);
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
        .d-metaline { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; margin: 0.9rem 0 1.1rem; font-size: 0.75rem; }
        .d-pair { display: inline-flex; gap: 0.4rem; align-items: baseline; }
        .d-pk { color: var(--text-faint); font-weight: 500; }
        .d-pv { font-family: var(--font-mono); color: var(--text-muted); word-break: break-all; }

        .full-toggle {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--brand-hi);
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            margin-bottom: 0.5rem;
        }
        .full-toggle:hover { background: var(--surface); border-color: var(--brand); }
        .full-toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
        .full-detail { display: none; margin-top: 0.75rem; }
        .full-detail.open { display: block; }

        .d-links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; }
        .d-links li { font-family: var(--font-mono); font-size: 0.75rem; color: var(--brand-hi); word-break: break-all; }
        .d-muted { color: var(--text-faint); font-style: italic; font-size: 0.8rem; }
        .d-error { color: #ff8a80; font-size: 0.85rem; }
        .d-notfound { color: var(--warning); font-size: 0.85rem; }

        .d-history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
        .hist-entry {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.75rem;
            padding: 0.5rem 0.65rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .hist-kind {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.62rem;
            letter-spacing: 0.04em;
            padding: 0.12rem 0.45rem;
            border-radius: var(--radius-sm);
            background: rgba(160, 160, 160, 0.15);
            font-family: var(--font-mono);
        }
        .hist-author { font-family: var(--font-mono); color: var(--text-muted); word-break: break-all; }
        .hist-lamport { color: var(--text-faint); font-family: var(--font-mono); }
        .hist-anchor { margin-left: auto; font-weight: 600; }
        .hist-anchor.anchored { color: var(--success); }
        .hist-anchor.pending { color: var(--warning); }
        .hist-flags { font-size: 0.72rem; color: var(--warning); margin-bottom: 0.5rem; }

            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-faint);
            text-transform: uppercase;

    <script>
        "use strict";

        // The launch token lives in THIS page's own URL (?t=…), placed there by the
        // CLI when it printed the dashboard link. Every API call must re-present it:
        // the server gates all routes and returns 401 without it. We read it once at
        // load; a missing token is surfaced immediately rather than after a failed
        // fetch, so the page is never silently blank.
        const TOKEN = new URLSearchParams(location.search).get("t") || "";

        const byId = (id) => document.getElementById(id);

        // Build a DOM node with attributes/children. `text` sets textContent, so any
        // caller-supplied string (note summaries, bodies, tags, ids, vault names) is
        // inserted as a text node — never parsed as HTML. This is the XSS boundary:
        // note content is arbitrary team text and must never reach innerHTML.
        function el(tag, props, ...children) {
            const node = document.createElement(tag);
            if (props) {
                for (const [k, v] of Object.entries(props)) {
                    if (k === "class") node.className = v;
                    else if (k === "text") node.textContent = v;
                    else node.setAttribute(k, v);
                }
            }
            for (const child of children) {
                if (child == null) continue;
                node.append(child); // strings become text nodes — safe by construction
            }
            return node;
        }

        // Compose an API URL carrying the token plus any non-empty filter params.
        // Empty values are OMITTED so a cleared filter input does not send `type=`
        // (which the backend would treat as "match the empty type" — i.e. nothing).
        function apiUrl(path, params) {
            const url = new URL(path, location.origin);
            url.searchParams.set("t", TOKEN);
            if (params) {
                for (const [k, v] of Object.entries(params)) {
                    if (v) url.searchParams.set(k, v);
                }
            }
            return url.toString();
        }

        // Vault-scoped path builder. The vault name is path-segment-encoded so a name
        // with a slash or space cannot break out of its route.
        function vaultPath(name, suffix) {
            return "/api/vaults/" + encodeURIComponent(name) + suffix;
        }

        // GET + parse JSON, throwing a status-tagged error on any non-200 so callers
        // can branch on `e.status` (401 token, 404 not-found, 500 unavailable). The
        // store's `{ "error": … }` detail, when present, is attached for display.
        async function apiGet(path, params) {
            let res;
            try {
                res = await fetch(apiUrl(path, params));
            } catch (netErr) {
                throw { status: 0, message: netErr.message };
            }
            if (!res.ok) {
                let detail = "";
                try {
                    const j = await res.json();
                    detail = (j && j.error) || "";
                } catch (_) { /* body was not JSON — leave detail empty */ }
                throw { status: res.status, detail };
            }
            return res.json();
        }

        function errorText(e) {
            if (e.status === 401) return "missing/invalid token — reopen the URL the CLI printed";
            if (e.status === 404) return "not found";
            const detail = e.detail ? ": " + e.detail : (e.message ? ": " + e.message : "");
            if (e.status) return "error " + e.status + detail;
            return "network error" + detail;
        }

        function showError(e) {
            const banner = byId("error-banner");
            banner.textContent = errorText(e);
            banner.hidden = false;
        }
        function clearError() {
            const banner = byId("error-banner");
            banner.hidden = true;
            banner.textContent = "";
        }

        function fmtDate(ms) {
            const n = Number(ms);
            if (!n) return "—";
            const d = new Date(n);
            return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString();
        }

        // Compact relative age for the dense list ("3d ago"); the absolute timestamp
        // is still shown in the expanded meta line.
        function fmtRelative(ms) {
            const n = Number(ms);
            if (!n) return "—";
            const diff = Date.now() - n;
            if (diff < 0) return fmtDate(ms);
            const s = Math.floor(diff / 1000);
            if (s < 60) return s + "s ago";
            const m = Math.floor(s / 60);
            if (m < 60) return m + "m ago";
            const h = Math.floor(m / 60);
            if (h < 24) return h + "h ago";
            const d = Math.floor(h / 24);
            if (d < 30) return d + "d ago";
            const mo = Math.floor(d / 30);
            if (mo < 12) return mo + "mo ago";
            return Math.floor(mo / 12) + "y ago";
        }

        function typeChip(t) {
            return el("span", { class: "chip chip-" + (t || "unknown"), text: t || "—" });
        }

        function tagList(tags) {
            const wrap = el("span", { class: "tags" });
            for (const t of tags || []) wrap.append(el("span", { class: "tag", text: t }));
            return wrap;
        }

        function modeBadge(semantic) {
            return el("span", {
                class: "badge " + (semantic ? "badge-semantic" : "badge-lexical"),
                text: semantic ? "semantic" : "lexical",
            });
        }

        // ---- Hash routing -------------------------------------------------------

        // Three levels: `#/` is the vaults landing, `#/vault/<name>` is that
        // namespace's repos, and `#/vault/<name>/repo/<repo>` is one repo's notes.
        // Hash-based so browser back/forward and deep links work without a server
        // round-trip.
        function parseHash() {
            const raw = location.hash.replace(/^#/, "");
            // Deepest route first: the notes route must match before the repos route,
            // so `<name>` is `[^/]+` (not `.+`) to avoid swallowing the `/repo/` segment.
            let m = raw.match(/^\/vault\/([^/]+)\/repo\/(.+)$/);
            if (m) return { view: "notes", name: decodeURIComponent(m[1]), repo: decodeURIComponent(m[2]) };
            m = raw.match(/^\/vault\/(.+)$/);
            if (m) return { view: "repos", name: decodeURIComponent(m[1]) };
            return { view: "vaults" };
        }

        function render() {
            clearError();
            const route = parseHash();
            if (route.view === "notes") showVaultView(route.name, route.repo);
            else if (route.view === "repos") showReposView(route.name);
            else showVaultsView();
        }

        // ---- View 1: vaults landing --------------------------------------------

        async function showVaultsView() {
            activeVault = null;
            byId("view-vault").hidden = true;
            byId("view-repos").hidden = true;
            byId("view-vaults").hidden = false;
            byId("subtitle").textContent = "Your memory vaults";
            try {
                const vaults = await apiGet("/api/vaults");
                renderVaults(vaults || []);
                clearError();
            } catch (e) {
                showError(e);
            }
        }

        function renderVaults(vaults) {
            const grid = byId("vaults-grid");
            grid.replaceChildren();
            byId("vaults-empty").hidden = vaults.length > 0;
            for (const v of vaults) grid.append(vaultCard(v));
        }

        function vaultCard(v) {
            const orgs = (v.orgs && v.orgs.length) ? v.orgs.join(", ") : "personal / catch-all";
            const card = el("div", {
                class: "vault-card", role: "button", tabindex: "0",
                "aria-label": "Open vault " + v.name,
            });
            card.append(
                el("div", { class: "vault-card-head" },
                    el("span", { class: "vault-card-name", text: v.name }),
                    v.is_current ? el("span", { class: "badge badge-current", text: "this repo" }) : null),
                el("div", { class: "vault-card-orgs", text: orgs }),
                el("div", { class: "vault-card-bucket", text: v.bucket }));
            const go = () => { location.hash = "#/vault/" + encodeURIComponent(v.name); };
            card.addEventListener("click", go);
            card.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
            });
            return card;
        }

        // ---- View 2: a namespace's repos ---------------------------------------

        // The namespace whose repos are shown. Re-checked after the await so a fast
        // back/forward cannot paint a stale repo list into a different namespace.
        let activeReposVault = null;

        async function showReposView(name) {
            activeVault = null;
            activeReposVault = name;
            byId("view-vaults").hidden = true;
            byId("view-vault").hidden = true;
            byId("view-repos").hidden = false;
            byId("subtitle").textContent = "Team memory";
            byId("crumb-vault-r").textContent = name;
            byId("repos-title").textContent = name;
            byId("repos-sub").textContent = "";
            byId("repos-list").replaceChildren();

            // First entry triggers the lazy backend build+sync (seconds on a cold vault).
            setReposStatus("loading", "Syncing " + name + "…");
            try {
                const data = await apiGet(vaultPath(name, "/repos"));
                if (activeReposVault !== name) return; // navigated away mid-fetch
                clearReposStatus();
                renderRepos(name, data.repos || []);
                clearError();
            } catch (e) {
                if (activeReposVault !== name) return;
                setReposStatus("error", vaultErrorText(e, name));
            }
        }

        function renderRepos(name, repos) {
            const total = repos.reduce((sum, r) => sum + (r.count || 0), 0);
            byId("repos-sub").textContent =
                repos.length + " repo" + (repos.length === 1 ? "" : "s") +
                " · " + total + " note" + (total === 1 ? "" : "s");
            const grid = byId("repos-list");
            grid.replaceChildren();
            byId("repos-empty").hidden = repos.length > 0;
            for (const r of repos) grid.append(repoCard(name, r));
        }

        function repoCard(name, r) {
            const isGlobal = r.repo === "global";
            const card = el("div", {
                class: "vault-card", role: "button", tabindex: "0",
                "aria-label": "Open repo " + r.repo,
            });
            card.append(
                el("div", { class: "vault-card-head" },
                    el("span", { class: "vault-card-name", text: r.repo })),
                el("div", { class: "vault-card-orgs", text: isGlobal ? "team-wide" : "repository" }),
                el("div", { class: "vault-card-bucket", text: r.count + (r.count === 1 ? " note" : " notes") }));
            const go = () => {
                location.hash = "#/vault/" + encodeURIComponent(name) + "/repo/" + encodeURIComponent(r.repo);
            };
            card.addEventListener("click", go);
            card.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
            });
            return card;
        }

        function setReposStatus(kind, msg) {
            setStatusBanner("repos-status", kind, msg);
            byId("repos-list").hidden = true;
            byId("repos-empty").hidden = true;
        }
        function clearReposStatus() {
            byId("repos-status").hidden = true;
            byId("repos-list").hidden = false;
        }

        // ---- View 3: one repo's memory -----------------------------------------

        // The repo currently displayed (its namespace is `activeVault`). Every async
        // handler re-checks BOTH after its await so a fast back/forward that switches
        // repo or vault mid-flight cannot paint stale results into the new view.
        let activeRepo = null;

        // The vault currently displayed. Every async handler re-checks this after its
        // await so a fast back/forward that switches vaults mid-flight cannot paint
        // stale results into the new vault's view.
        let activeVault = null;
        let expandedItem = null; // single-open accordion

        async function showVaultView(name, repo) {
            activeVault = name;
            activeRepo = repo;
            byId("view-vaults").hidden = true;
            byId("view-repos").hidden = true;
            byId("view-vault").hidden = false;
            byId("subtitle").textContent = "Team memory";
            // The namespace crumb links back to its repos page; the repo is the leaf.
            byId("crumb-vault").textContent = name;
            byId("crumb-vault").setAttribute("href", "#/vault/" + encodeURIComponent(name));
            byId("crumb-repo").textContent = repo;
            byId("vault-title").textContent = repo;
            byId("vault-sub").textContent = name;
            byId("vault-badges").replaceChildren();
            byId("vault-health").textContent = "";
            clearFilterInputs();
            byId("notes-table").replaceChildren();
            expandedItem = null;

            // First entry triggers a lazy backend build+sync that can take seconds. The
            // list is scoped to this repo via `?repo=`; type/tag/search filters compose
            // on top of it (see `currentFilters`).
            setVaultStatus("loading", "Syncing " + name + "…");
            try {
                const data = await apiGet(vaultPath(name, "/notes"), { repo });
                if (activeVault !== name || activeRepo !== repo) return; // navigated away
                clearVaultStatus();
                renderNotes(data.notes || []);
                clearError();
            } catch (e) {
                if (activeVault !== name || activeRepo !== repo) return;
                setVaultStatus("error", vaultErrorText(e, name));
                return;
            }
            loadVaultHealth(name);
        }

        async function loadVaultHealth(name) {
            try {
                const h = await apiGet(vaultPath(name, "/health"));
                if (activeVault !== name) return;
                // The mode badge lives on the health response now that the notes view
                // loads `/notes` (repo-scoped) rather than `/overview`.
                byId("vault-badges").replaceChildren(modeBadge(h.semantic));
                byId("vault-health").textContent =
                    (h.semantic ? "semantic" : "lexical") + " · " +
                    (h.synced ? "synced now" : "already fresh") + " · " +
                    h.note_count + " notes";
            } catch (_) {
                // Health is a secondary line; a failure just leaves it blank.
            }
        }

        function vaultErrorText(e, name) {
            if (e.status === 401) return errorText(e);
            if (e.status === 404) return "unknown vault: " + name;
            const detail = e.detail ? ": " + e.detail : (e.message ? ": " + e.message : "");
            return "vault unavailable" + detail;
        }

        // Shared loading/error banner painter for both the repos and notes views.
        function setStatusBanner(id, kind, msg) {
            const s = byId(id);
            s.className = "vault-status " + (kind === "error" ? "status-error" : "status-loading");
            s.replaceChildren();
            if (kind === "loading") s.append(el("span", { class: "spinner" }));
            s.append(document.createTextNode(msg));
            s.hidden = false;
        }

        function setVaultStatus(kind, msg) {
            setStatusBanner("vault-status", kind, msg);
            byId("notes-table").hidden = true;
            byId("notes-empty").hidden = true;
        }
        function clearVaultStatus() {
            byId("vault-status").hidden = true;
            byId("notes-table").hidden = false;
        }

        // ---- The compact accordion list ----------------------------------------

        function renderNotes(notes) {
            const list = byId("notes-table");
            list.replaceChildren();
            expandedItem = null;
            byId("notes-empty").hidden = notes.length > 0;
            list.hidden = notes.length === 0;
            for (const n of notes) list.append(noteItem(n));
        }

        function noteItem(n) {
            const item = el("li", {
                class: "note-item", role: "button", tabindex: "0", "aria-expanded": "false",
                "aria-label": "Note: " + n.summary,
            });
            const head = el("div", { class: "note-head" },
                typeChip(n.note_type),
                el("span", { class: "note-summary", text: n.summary }),
                el("span", { class: "note-meta", text: n.repo + " · " + fmtRelative(n.updated) }));
            const expand = el("div", { class: "note-expand" });
            // Clicks inside the expanded panel must not bubble up and collapse the row
            // (the row's own click handler toggles); only the head toggles.
            expand.addEventListener("click", (e) => e.stopPropagation());
            item.append(head, expand);
            item._noteId = n.id;
            item._detail = null; // cached NoteDetailDto after first expand
            item.addEventListener("click", () => toggleItem(item));
            item.addEventListener("keydown", (e) => onItemKey(e, item));
            return item;
        }

        function onItemKey(e, item) {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                toggleItem(item);
            } else if (e.key === "Escape") {
                if (item.classList.contains("open")) {
                    e.preventDefault();
                    collapseItem(item);
                    item.focus();
                }
            } else if (e.key === "ArrowDown") {
                e.preventDefault();
                focusSibling(item, 1);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                focusSibling(item, -1);
            }
        }

        function focusSibling(item, dir) {
            const items = Array.from(byId("notes-table").children);
            const next = items[items.indexOf(item) + dir];
            if (next) next.focus();
        }

        async function toggleItem(item) {
            if (item.classList.contains("open")) {
                collapseItem(item);
                item.focus();
                return;
            }
            // Single-open: collapse whatever was open before expanding this one.
            if (expandedItem && expandedItem !== item) collapseItem(expandedItem);
            item.classList.add("open");
            item.setAttribute("aria-expanded", "true");
            expandedItem = item;
            await ensureDetail(item);
        }

        function collapseItem(item) {
            item.classList.remove("open");
            item.setAttribute("aria-expanded", "false");
            if (expandedItem === item) expandedItem = null;
        }

        // Fetch the note's full detail ONCE and cache it on the element; a re-expand
        // finds `_detail` populated and the rendered DOM still present (collapse only
        // hides via CSS), so it is instant with no second request.
        async function ensureDetail(item) {
            if (item._detail) return;
            const expand = item.querySelector(".note-expand");
            expand.replaceChildren(el("div", { class: "d-muted", text: "Loading…" }));
            const name = activeVault;
            try {
                const detail = await apiGet(vaultPath(name, "/notes/" + encodeURIComponent(item._noteId)));
                if (!item.classList.contains("open") || activeVault !== name) return;
                item._detail = detail;
                renderExpanded(item, detail);
            } catch (e) {
                const cls = e.status === 404 ? "d-notfound" : "d-error";
                expand.replaceChildren(el("div", { class: cls, text: errorText(e) }));
            }
        }

        function firstLines(s, n) {
            return (s || "").split("\n").slice(0, n).join("\n");
        }

        function metaLine(d) {
            const line = el("div", { class: "d-metaline" });
            const pairs = [
                ["version", (d.version || "").slice(0, 12)],
                ["created", fmtDate(d.created)],
                ["updated", fmtDate(d.updated)],
            ];
            for (const [k, v] of pairs) {
                line.append(el("span", { class: "d-pair" },
                    el("span", { class: "d-pk", text: k }),
                    el("span", { class: "d-pv", text: v || "—" })));
            }
            return line;
        }

        function historySection(h) {
            const sec = el("div", { class: "d-section" }, el("div", { class: "d-label", text: "History" }));
            const flags = [];
            if (h.tombstoned) flags.push("tombstoned");
            if (h.redacted) flags.push("redacted");
            if (flags.length) sec.append(el("div", { class: "hist-flags", text: flags.join(" · ") }));
            const entries = h.entries || [];
            if (!entries.length) {
                sec.append(el("div", { class: "d-muted", text: "No recorded ops." }));
                return sec;
            }
            const list = el("ul", { class: "d-history" });
            for (const e of entries) {
                list.append(el("li", { class: "hist-entry" },
                    el("span", { class: "hist-kind", text: e.kind }),
                    el("span", { class: "hist-author", text: e.author }),
                    el("span", { class: "hist-lamport", text: "lamport " + e.lamport }),
                    el("span", {
                        class: "hist-anchor " + (e.anchored ? "anchored" : "pending"),
                        text: e.anchored ? "anchored" : "pending",
                    })));
            }
            sec.append(list);
            return sec;
        }

        function linksSection(links) {
            const list = el("ul", { class: "d-links" });
            for (const l of links) list.append(el("li", { text: l }));
            return el("div", { class: "d-section" }, el("div", { class: "d-label", text: "Links" }), list);
        }

        // Two tiers: an at-a-glance preview (first lines + tags + meta) and a
        // "Full detail" toggle that reveals the already-loaded full body, history,
        // and links — no second fetch.
        function renderExpanded(item, d) {
            const expand = item.querySelector(".note-expand");
            const bodyStr = d.body || "";

            const parts = [
                el("div", { class: "d-label", text: "Preview" }),
                el("pre", { class: "d-preview", text: firstLines(bodyStr, 4) || "(empty)" }),
                metaLine(d),
            ];
            if (d.tags && d.tags.length) {
                parts.push(el("div", { class: "d-section" },
                    el("div", { class: "d-label", text: "Tags" }), tagList(d.tags)));
            }

            const full = el("div", { class: "full-detail" });
            full.append(el("div", { class: "d-section" },
                el("div", { class: "d-label", text: "Body" }),
                el("pre", { class: "d-body", text: bodyStr })));
            if (d.history) full.append(historySection(d.history));
            if (d.links && d.links.length) full.append(linksSection(d.links));

            const toggle = el("button", { class: "full-toggle", type: "button", "aria-expanded": "false" });
            toggle.textContent = "Full detail ▾";
            toggle.addEventListener("click", (e) => {
                e.stopPropagation();
                const open = full.classList.toggle("open");
                toggle.setAttribute("aria-expanded", open ? "true" : "false");
                toggle.textContent = open ? "Full detail ▴" : "Full detail ▾";
            });

            parts.push(toggle, full);
            expand.replaceChildren(...parts);
        }

        // ---- Filters ------------------------------------------------------------

        function currentFilters() {
            return {
                q: byId("f-q").value.trim(),
                type: byId("f-type").value.trim(),
                // The repo dimension is the route (the drill-down), not a filter input —
                // so every list request stays scoped to the repo the user opened.
                repo: activeRepo || "",
                tag: byId("f-tag").value.trim(),
            };
        }

        function clearFilterInputs() {
            for (const id of ["f-q", "f-type", "f-tag"]) byId(id).value = "";
        }

        // Debounce keystrokes so a fast typist issues one request, not one per key.
        const FILTER_DEBOUNCE_MS = 200;
        let filterTimer = null;
        function onFilterChange() {
            clearTimeout(filterTimer);
            filterTimer = setTimeout(refreshNotes, FILTER_DEBOUNCE_MS);
        }

        async function refreshNotes() {
            if (!activeVault) return;
            const name = activeVault, repo = activeRepo;
            // Known limitation: no generation guard on the list beyond the vault/repo
            // recheck — two rapid filter requests within one repo can still land out of
            // order. Acceptable for a loopback, single-user surface.
            try {
                const data = await apiGet(vaultPath(name, "/notes"), currentFilters());
                if (activeVault !== name || activeRepo !== repo) return;
                renderNotes(data.notes || []);
                clearError();
            } catch (e) {
                if (activeVault === name && activeRepo === repo) showError(e);
            }
        }

        // ---- Boot ---------------------------------------------------------------

        function init() {
            if (!TOKEN) showError({ status: 401 });

            for (const id of ["f-q", "f-type", "f-tag"]) {
                byId(id).addEventListener("input", onFilterChange);
            }
            byId("f-clear").addEventListener("click", () => {
                // Cancel any pending debounced refresh so clearing fires exactly one
                // request, not a redundant second one from the last keystroke.
                clearTimeout(filterTimer);
                clearFilterInputs();
                refreshNotes();
            });

            window.addEventListener("hashchange", render);
            render();
        }

        init();
    </script>
</body>
</html>

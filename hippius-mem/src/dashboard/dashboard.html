<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/hippius-logo.svg">
    <title>Hippius Memory — Team Dashboard</title>
    <style nonce="__CSP_NONCE__">
        /* The fonts are served by this binary (`/assets/…`, see `asset` in mod.rs):
           the CSP allows `font-src 'self'` only, and a loopback tool must not
           depend on a font CDN. All three are variable fonts under the SIL OFL
           (licenses in src/dashboard/assets/). */
        @font-face {
            font-family: "Geist";
            src: url("/assets/geist.woff2") format("woff2");
            font-weight: 400 600;
            font-display: swap;
        }
        @font-face {
            font-family: "Geist Mono";
            src: url("/assets/geist-mono.woff2") format("woff2");
            font-weight: 400 500;
            font-display: swap;
        }
        @font-face {
            font-family: "Unbounded";
            src: url("/assets/unbounded.woff2") format("woff2");
            font-weight: 400 600;
            font-display: swap;
        }

        /* Layout: one screen, three glass panes on an 8px grid.
           rail 248 | list fluid | inspector 416, 16px gutters, 56px top bar.
           Single dark theme by design: the aurora only reads on ink. */
        :root {
            color-scheme: dark;
            --ink: #06070d;
            --glass: rgba(15, 17, 30, 0.58);
            --line: rgba(150, 160, 255, 0.09);
            --line-hi: rgba(150, 160, 255, 0.2);
            --text: #e7e9f6;
            --body: #c9cce0;
            --muted: #9097b8;
            --faint: #7a80a6;
            --accent: #8b97ff;
            --accent-2: #45e3d4;
            --brand: #3167dd;
            --danger: #ff6b81;

            --t-decision: #5cb6ff;
            --t-gotcha: #ff8f5e;
            --t-convention: #b993ff;
            --t-reference: #52e3a4;
            --t-context: #e8c86a;

            --f-display: "Unbounded", "Geist", system-ui, sans-serif;
            --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
            --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

            --gutter: 16px;
            --bar: 56px;
            --rail: 248px;
            --insp: 416px;
            --r: 14px;
            --r-sm: 8px;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--ink);
            color: var(--text);
            font: 400 13px/20px var(--f-ui);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        [hidden] { display: none !important; }
        .sr-only {
            position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip-path: inset(50%); white-space: nowrap;
        }
        button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
        button:disabled { cursor: default; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

        /* ---------- type colors: one class per note type sets --c ---------- */
        .t-decision { --c: var(--t-decision); }
        .t-gotcha { --c: var(--t-gotcha); }
        .t-convention { --c: var(--t-convention); }
        .t-reference { --c: var(--t-reference); }
        .t-context { --c: var(--t-context); }
        .t-other { --c: var(--muted); }

        /* ---------- atmosphere ---------- */
        .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .aurora i {
            position: absolute; border-radius: 50%; filter: blur(110px);
            animation: drift 38s ease-in-out infinite alternate;
        }
        .aurora i:nth-child(1) { width: 720px; height: 560px; left: -160px; top: -200px; background: #3b2cff; opacity: .55; }
        .aurora i:nth-child(2) { width: 640px; height: 520px; right: -180px; top: 10%; background: #0fb5b0; opacity: .38; animation-duration: 46s; }
        .aurora i:nth-child(3) { width: 760px; height: 480px; left: 30%; bottom: -260px; background: #b0249a; opacity: .34; animation-duration: 52s; }
        .aurora i:nth-child(4) { width: 380px; height: 380px; left: 52%; top: 18%; background: #5a2bd8; opacity: .22; animation-duration: 30s; }
        .aurora::after {
            content: ""; position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(140, 150, 255, .035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(140, 150, 255, .035) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
        }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 60px) scale(1.12); }
        }

        /* ---------- shell ---------- */
        .app {
            position: relative; z-index: 1; height: 100%;
            display: grid;
            grid-template-columns: var(--rail) minmax(0, 1fr) var(--insp);
            grid-template-rows: var(--bar) minmax(0, 1fr);
            gap: var(--gutter);
            padding: var(--gutter);
        }
        .pane {
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: var(--r);
            backdrop-filter: blur(28px) saturate(140%);
            -webkit-backdrop-filter: blur(28px) saturate(140%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 24px 64px -24px rgba(0, 0, 0, .6);
            min-height: 0;
        }
        .scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-hi) transparent; }
        .label {
            font: 500 11px/16px var(--f-ui);
            letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
        }
        .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
        .muted { color: var(--faint); }
        .kbd {
            font: 500 11px/16px var(--f-mono); color: var(--muted); padding: 4px 8px;
            border: 1px solid var(--line-hi); border-radius: 6px; background: rgba(255, 255, 255, .03);
        }

        /* ---------- top bar ---------- */
        .bar {
            grid-column: 1 / -1;
            display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--insp);
            gap: var(--gutter); align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 12px; padding-left: 16px; min-width: 0; }
        .logo { width: 40px; height: 40px; flex: none; }
        .logo img { object-fit: contain;
            display: block; width: 100%; height: 100%;
            filter: drop-shadow(0 0 8px rgba(49, 103, 221, .75)) drop-shadow(0 0 20px rgba(49, 103, 221, .35));
        }
        .brand h1 { margin: 0; font: 500 14px/20px var(--f-display); letter-spacing: .02em; white-space: nowrap; }
        .brand small { display: block; font: 400 11px/16px var(--f-mono); color: var(--faint); }

        .search {
            height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px;
            background: var(--glass); border: 1px solid var(--line); border-radius: 12px;
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            transition: border-color .2s, box-shadow .2s;
        }
        .search:focus-within {
            border-color: rgba(139, 151, 255, .5);
            box-shadow: 0 0 0 4px rgba(139, 151, 255, .1), 0 0 32px rgba(139, 151, 255, .18);
        }
        .search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
        .search input {
            flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none;
            color: var(--text); font: 400 14px/20px var(--f-ui);
        }
        .search input::placeholder { color: var(--faint); }
        .search input::-webkit-search-cancel-button { filter: invert(.6); }

        .status { display: flex; justify-content: flex-end; gap: 8px; padding-right: 4px; min-width: 0; }
        .pill {
            height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px;
            border: 1px solid var(--line); border-radius: 999px; background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            font: 500 12px/16px var(--f-ui); color: var(--muted); white-space: nowrap;
        }
        button.pill:hover:not(:disabled) { color: var(--text); border-color: var(--line-hi); }
        .pill b { color: var(--text); font-weight: 500; }
        .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2); }
        .dot.off { background: var(--faint); box-shadow: none; }
        .dot.warn { background: var(--t-gotcha); box-shadow: 0 0 10px var(--t-gotcha); }
        .dot.busy { animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 50% { box-shadow: 0 0 2px var(--accent-2); opacity: .5; } }

        /* ---------- rail ---------- */
        .rail { display: flex; flex-direction: column; padding: 16px 8px; gap: 24px; }
        .rail section { display: flex; flex-direction: column; gap: 4px; }
        .rail .label { padding: 0 8px 4px; display: flex; justify-content: space-between; }
        .nav-item {
            position: relative; width: 100%; height: 40px;
            display: grid; grid-template-columns: 24px minmax(0, 1fr) auto;
            align-items: center; gap: 8px; padding: 0 8px; border-radius: var(--r-sm); text-align: left;
            color: var(--muted); transition: background .15s, color .15s;
        }
        .nav-item:hover { background: rgba(255, 255, 255, .035); color: var(--text); }
        .nav-item[aria-current="true"] {
            background: linear-gradient(90deg, rgba(139, 151, 255, .16), rgba(139, 151, 255, .04));
            color: var(--text); box-shadow: inset 0 0 0 1px rgba(139, 151, 255, .18);
        }
        .nav-item[aria-current="true"]::before {
            content: ""; position: absolute; left: -8px; top: 12px; width: 3px; height: 16px;
            border-radius: 0 3px 3px 0; background: var(--accent); box-shadow: 0 0 12px var(--accent);
        }
        .nav-item .ic {
            width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
            font: 600 11px/1 var(--f-mono);
        }
        .nav-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
        .nav-item .ct { font: 400 12px/16px var(--f-mono); color: var(--faint); font-variant-numeric: tabular-nums; }
        .vault .ic { background: rgba(139, 151, 255, .14); color: var(--accent); }
        .tag-current {
            font: 500 10px/16px var(--f-ui); letter-spacing: .06em; text-transform: uppercase;
            color: var(--accent-2); padding: 0 6px; border-radius: 4px; background: rgba(69, 227, 212, .1);
        }
        .repo .ic { color: var(--faint); }
        .repo .meter {
            position: absolute; left: 40px; right: 8px; bottom: 6px; height: 2px; border-radius: 2px;
            background: rgba(255, 255, 255, .04); overflow: hidden;
        }
        .repo .meter i {
            display: block; height: 100%; opacity: .55;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
        }
        .rail-note { padding: 0 8px; color: var(--faint); font-size: 12px; }
        .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
        .toggle {
            height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 12px;
            border-radius: var(--r-sm); border: 1px dashed var(--line-hi); color: var(--muted); font-size: 12px;
        }
        .toggle:hover, .toggle[aria-pressed="true"] { color: var(--text); border-color: rgba(139, 151, 255, .4); }
        .foot-line { font: 400 11px/16px var(--f-mono); color: var(--faint); }

        /* ---------- center ---------- */
        /* Flex, not grid rows: the error banner toggles `hidden`, and a removed
           grid item would shift the list into an `auto` row. */
        .center { display: flex; flex-direction: column; gap: var(--gutter); min-height: 0; min-width: 0; }
        .stats { display: grid; grid-template-columns: 1fr 1.2fr 1.4fr; gap: var(--gutter); }
        .stat { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 136px; min-width: 0; }
        .stat-head { display: flex; justify-content: space-between; align-items: center; height: 16px; gap: 8px; }
        .big { font: 500 32px/40px var(--f-display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
        .big small { font: 400 12px/16px var(--f-ui); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
        .bar-seg { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; background: rgba(255, 255, 255, .04); }
        .bar-seg i { display: block; height: 100%; border-radius: 1px; background: var(--c); box-shadow: 0 0 10px var(--c); }
        .legend { display: grid; grid-template-columns: repeat(2, auto); justify-content: start; column-gap: 16px; row-gap: 4px; }
        .legend span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
        .legend b { color: var(--text); font: 500 12px/16px var(--f-mono); }
        .sw { width: 6px; height: 6px; border-radius: 2px; flex: none; background: var(--c); }

        .act { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; height: 72px; }
        .act > div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; min-width: 0; }
        .act .col {
            width: 100%; max-width: 32px; height: 2px; border-radius: 4px 4px 1px 1px;
            background: linear-gradient(180deg, var(--accent), rgba(139, 151, 255, .15));
            box-shadow: 0 0 16px rgba(139, 151, 255, .25);
        }
        .act .col.zero { background: rgba(255, 255, 255, .08); box-shadow: none; }
        .act b { font: 500 12px/16px var(--f-mono); }
        .act span { font-size: 11px; line-height: 16px; color: var(--faint); }

        .reuse { display: flex; flex-direction: column; gap: 8px; }
        .reuse button {
            display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center;
            text-align: left; height: 24px; color: var(--muted);
        }
        .reuse button:hover { color: var(--text); }
        .reuse .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
        .pips { display: flex; gap: 2px; align-items: center; }
        .pips i { width: 6px; height: 12px; border-radius: 2px; background: rgba(255, 255, 255, .08); }
        .pips i.on { background: var(--accent-2); box-shadow: 0 0 6px rgba(69, 227, 212, .6); }
        .pips b { font: 500 11px/16px var(--f-mono); color: var(--muted); margin-left: 6px; min-width: 16px; text-align: right; }
        .stat-empty { color: var(--faint); font-size: 12px; }

        .banner {
            padding: 12px 16px; border-radius: 10px; font-size: 13px;
            color: var(--text); background: rgba(255, 107, 129, .1); border: 1px solid rgba(255, 107, 129, .35);
        }

        .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .chip {
            height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px;
            border-radius: 999px; border: 1px solid var(--line); background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            font-weight: 500; font-size: 12px; color: var(--muted); transition: color .15s, border-color .15s, background .15s;
        }
        .chip:hover { color: var(--text); border-color: var(--line-hi); }
        .chip[aria-pressed="true"] {
            color: var(--text);
            border-color: color-mix(in srgb, var(--c) 55%, transparent);
            background: color-mix(in srgb, var(--c) 14%, transparent);
            box-shadow: 0 0 20px color-mix(in srgb, var(--c) 22%, transparent);
        }
        .chip .sw { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px var(--c); }
        .chip .n { font: 400 11px/16px var(--f-mono); color: var(--faint); }
        .chip.tag-chip { --c: var(--accent); font-family: var(--f-mono); font-weight: 400; }
        .filters .spacer { flex: 1; }
        .filters .count { font: 400 12px/16px var(--f-mono); color: var(--faint); }

        .list { display: flex; flex-direction: column; flex: 1; min-height: 0; }
        .list-head, .row {
            display: grid; grid-template-columns: 120px minmax(0, 1fr) 144px 72px;
            gap: 16px; align-items: center; padding: 0 16px;
        }
        .list-head { height: 40px; border-bottom: 1px solid var(--line); flex: none; }
        .list-head .label:last-child { text-align: right; }
        .rows { flex: 1; min-height: 0; list-style: none; margin: 0; padding: 0; }
        .row {
            position: relative; width: 100%; height: 64px; text-align: left;
            border-bottom: 1px solid rgba(150, 160, 255, .05); transition: background .15s;
        }
        .row:hover { background: rgba(255, 255, 255, .025); }
        .row[aria-selected="true"] {
            background: linear-gradient(90deg, color-mix(in srgb, var(--c) 12%, transparent), transparent 70%);
        }
        .row[aria-selected="true"]::before {
            content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 2px; border-radius: 2px;
            background: var(--c); box-shadow: 0 0 12px var(--c);
        }
        .type {
            justify-self: start; height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px;
            border-radius: 6px; font: 500 11px/16px var(--f-ui); letter-spacing: .04em; text-transform: uppercase;
            color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--c) 22%, transparent); white-space: nowrap;
        }
        .type::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
        .row .sum { display: flex; flex-direction: column; min-width: 0; }
        .row .sum b { font-weight: 500; font-size: 13px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .row .sum span { font: 400 11px/16px var(--f-mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .row .repo-c { font: 400 12px/16px var(--f-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .row .when { font: 400 12px/16px var(--f-mono); color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
        .placeholder { padding: 48px 16px; text-align: center; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .placeholder.error { color: var(--danger); }
        .spinner {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid rgba(139, 151, 255, .2); border-top-color: var(--accent);
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- inspector ---------- */
        .insp { display: flex; flex-direction: column; min-width: 0; }
        .insp-head {
            padding: 24px 24px 16px; display: flex; flex-direction: column; gap: 16px;
            border-bottom: 1px solid var(--line); position: relative; overflow: hidden; flex: none;
        }
        .insp-head::after {
            content: ""; position: absolute; right: -80px; top: -120px; width: 280px; height: 240px; border-radius: 50%;
            background: var(--c); filter: blur(80px); opacity: .22; pointer-events: none;
        }
        .insp-head .type { align-self: flex-start; }
        .insp-head h2 { margin: 0; font: 500 17px/24px var(--f-ui); letter-spacing: -.005em; text-wrap: balance; overflow-wrap: anywhere; }
        .meta { display: grid; grid-template-columns: 88px minmax(0, 1fr); row-gap: 8px; column-gap: 16px; margin: 0; }
        .meta dt { color: var(--faint); font-size: 12px; line-height: 20px; }
        .meta dd { margin: 0; font: 400 12px/20px var(--f-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .insp-body { padding: 24px; display: flex; flex-direction: column; gap: 24px; }
        .prose {
            margin: 0; font: 400 13px/22px var(--f-ui); color: var(--body); max-width: 62ch;
            white-space: pre-wrap; overflow-wrap: anywhere;
        }
        .sec { display: flex; flex-direction: column; gap: 12px; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tags button {
            font: 400 11px/16px var(--f-mono); color: var(--muted); padding: 4px 8px; border-radius: 6px;
            background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
        }
        .tags button:hover { color: var(--text); border-color: var(--line-hi); }
        .links { display: flex; flex-direction: column; gap: 8px; }
        .link-card {
            display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px;
            text-align: left; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02);
            transition: border-color .15s, background .15s;
        }
        .link-card:hover { border-color: var(--line-hi); background: rgba(255, 255, 255, .04); }
        .link-card .sw { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px var(--c); }
        .link-card b { font-weight: 500; font-size: 12px; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
        .link-card span span { font: 400 11px/16px var(--f-mono); color: var(--faint); }
        .ghost {
            align-self: flex-start; height: 32px; padding: 0 12px; border-radius: var(--r-sm);
            border: 1px solid var(--line-hi); color: var(--muted); font-size: 12px; font-weight: 500;
        }
        .ghost:hover:not(:disabled) { color: var(--text); border-color: rgba(139, 151, 255, .4); }
        .flags { font: 500 11px/16px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--danger); }
        .chain { display: flex; flex-direction: column; padding-left: 4px; }
        .op { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding-bottom: 16px; }
        .op:last-child { padding-bottom: 0; }
        .op::before { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 2px; background: linear-gradient(var(--line-hi), transparent); }
        .op:last-child::before { display: none; }
        .node { width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--accent-2); background: var(--ink); }
        .node.anchored { background: var(--accent-2); box-shadow: 0 0 0 4px rgba(69, 227, 212, .12), 0 0 14px var(--accent-2); }
        .op b { font-weight: 500; font-size: 12px; line-height: 20px; display: block; }
        .op .who { font: 400 11px/16px var(--f-mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
        .op .st { font: 500 10px/20px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-2); }
        .op .st.pending { color: var(--faint); }
        .insp-body-flush { display: flex; flex-direction: column; gap: 24px; }
        .insp-empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 48px 24px; color: var(--faint); }

        /* ---------- layout grid overlay (G) ---------- */
        .overlay { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
        .overlay::before {
            content: ""; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255, 80, 160, .07) 1px, transparent 1px);
            background-size: 100% 8px;
        }
        .overlay .cols {
            position: absolute; inset: var(--gutter); display: grid;
            grid-template-columns: var(--rail) minmax(0, 1fr) var(--insp); gap: var(--gutter);
        }
        .overlay .cols i { background: rgba(255, 80, 160, .05); outline: 1px solid rgba(255, 80, 160, .35); position: relative; }
        .overlay .cols i::after {
            content: attr(data-w); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font: 500 11px/16px var(--f-mono); color: #ff70b4; background: rgba(6, 7, 13, .85); padding: 4px 8px; border-radius: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            .aurora i, .dot.busy, .spinner { animation: none; }
            * { transition: none !important; }
        }

        /* ---------- narrower screens ---------- */
        @media (max-width: 1280px) {
            :root { --insp: 360px; --rail: 224px; }
            .stats { grid-template-columns: 1fr 1fr; }
            .stats .stat:last-child { grid-column: 1 / -1; min-height: 0; }
            .list-head, .row { grid-template-columns: 112px minmax(0, 1fr) 112px 48px; }
        }
        @media (max-width: 1024px) {
            body { overflow: auto; }
            .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
            .bar { grid-template-columns: minmax(0, 1fr); }
            .brand { padding-left: 0; }
            .status { justify-content: flex-start; flex-wrap: wrap; }
            .rail-foot, .overlay { display: none; }
            .center .list { max-height: 560px; }
        }
        @media (max-width: 640px) {
            .stats { grid-template-columns: 1fr; }
            .list-head, .row { grid-template-columns: minmax(0, 1fr) 56px; }
            .list-head .label:nth-child(1), .list-head .label:nth-child(3), .row .type, .row .repo-c { display: none; }
            .meta { grid-template-columns: 72px minmax(0, 1fr); }
        }
    </style>
</head>
<body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <div class="app">
        <header class="bar">
            <div class="brand">
                <div class="logo">
                    <img src="/assets/hippius-logo.svg" alt="">
                </div>
                <div>
                    <h1>Hippius Memory</h1>
                    <small id="origin"></small>
                </div>
            </div>
            <label class="search" for="q">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="q" type="search" placeholder="Recall across this vault" autocomplete="off" spellcheck="false" aria-label="Search notes">
                <span class="kbd">/</span>
            </label>
            <div class="status">
                <span class="pill" id="mode-pill" hidden></span>
                <button class="pill" id="sync-pill" type="button" title="Check for teammates' new notes" hidden></button>
            </div>
        </header>

        <nav class="pane rail scroll" aria-label="Vaults and repos">
            <section>
                <div class="label"><span>Vaults</span><span class="mono" id="vault-count"></span></div>
                <div id="vaults"></div>
            </section>
            <section>
                <div class="label"><span>Repos</span><span class="mono" id="repo-count"></span></div>
                <div id="repos"></div>
            </section>
            <div class="rail-foot">
                <button class="toggle" id="grid-toggle" type="button" aria-pressed="false"><span>Layout grid</span><span class="kbd">G</span></button>
                <div class="foot-line">Read-only · loopback only</div>
            </div>
        </nav>

        <main class="center">
            <div class="stats">
                <section class="pane stat" aria-labelledby="stat-notes">
                    <div class="stat-head"><span class="label" id="stat-notes">Live notes</span></div>
                    <div class="big" id="total">–</div>
                    <div class="bar-seg" id="type-bar"></div>
                    <div class="legend" id="type-legend"></div>
                </section>
                <section class="pane stat" aria-labelledby="stat-activity">
                    <div class="stat-head"><span class="label" id="stat-activity">Activity</span><span class="label mono" id="act-window"></span></div>
                    <div class="act" id="act"></div>
                </section>
                <section class="pane stat" aria-labelledby="stat-reuse">
                    <div class="stat-head"><span class="label" id="stat-reuse">Most reused</span><span class="label">Teammates</span></div>
                    <div class="reuse" id="reuse"></div>
                </section>
            </div>

            <div class="banner" id="error-banner" role="alert" hidden></div>

            <div class="filters" id="filters"></div>

            <section class="pane list" aria-label="Notes">
                <div class="list-head">
                    <span class="label">Type</span><span class="label">Summary</span><span class="label">Repo</span><span class="label">Updated</span>
                </div>
                <!-- id="notes-table" is the served-file marker asserted by index_serves_html. -->
                <ul class="rows scroll" id="notes-table" role="listbox" aria-label="Notes"></ul>
                <div class="placeholder" id="list-status" hidden></div>
            </section>
        </main>

        <aside class="pane insp scroll" id="insp" aria-label="Note detail"></aside>
        <div class="sr-only" id="announce" aria-live="polite"></div>
    </div>

    <div class="overlay" id="overlay" hidden>
        <div class="cols"><i data-w="rail 248"></i><i data-w="list fluid · gutters 16"></i><i data-w="inspector 416"></i></div>
    </div>

    <script nonce="__CSP_NONCE__">
        "use strict";

        // Auth is the HttpOnly session cookie set by the one-shot bootstrap
        // exchange (`GET /?t=…` → 302 to `/`). Same-origin fetch sends it;
        // JS never reads the token.

        const byId = (id) => document.getElementById(id);

        // Build a DOM node with attributes/children. `text` sets textContent, so any
        // caller-supplied string (note summaries, bodies, tags, ids, vault names) is
        // inserted as a text node — never parsed as HTML. This is the XSS boundary:
        // note content is arbitrary team text and must never reach innerHTML.
        function el(tag, props, ...children) {
            const node = document.createElement(tag);
            if (props) {
                for (const [k, v] of Object.entries(props)) {
                    if (k === "class") node.className = v;
                    else if (k === "text") node.textContent = v;
                    else node.setAttribute(k, v);
                }
            }
            for (const child of children) {
                if (child == null) continue;
                node.append(child); // strings become text nodes — safe by construction
            }
            return node;
        }

        // ---- API ----------------------------------------------------------------

        // Same-origin API URL; the session cookie is sent by the browser, never
        // as a query param. Empty filter values are omitted so a cleared filter
        // does not send `type=` (which the backend would treat as match-nothing).
        function apiUrl(path, params) {
            const url = new URL(path, location.origin);
            if (params) {
                for (const [k, v] of Object.entries(params)) {
                    if (v) url.searchParams.set(k, v);
                }
            }
            return url.toString();
        }

        // Vault-scoped path builder. The vault name is path-segment-encoded so a name
        // with a slash or space cannot break out of its route.
        function vaultPath(name, suffix) {
            return "/api/vaults/" + encodeURIComponent(name) + suffix;
        }

        function notePath(name, id, suffix) {
            return vaultPath(name, "/notes/" + encodeURIComponent(id) + (suffix || ""));
        }

        // GET + parse JSON, throwing a status-tagged error on any non-200 so callers
        // can branch on `e.status` (401 token, 404 not-found, 409 migrating, 500
        // unavailable). The store's `{ "error": … }` detail is attached for display.
        async function apiGet(path, params) {
            let res;
            try {
                res = await fetch(apiUrl(path, params));
            } catch (netErr) {
                throw { status: 0, message: netErr.message };
            }
            if (!res.ok) {
                let detail = "";
                try {
                    const j = await res.json();
                    detail = (j && j.error) || "";
                } catch (_) { /* body was not JSON — leave detail empty */ }
                throw { status: res.status, detail };
            }
            return res.json();
        }

        function errorText(e) {
            if (e.status === 401) return "session expired or missing — re-run hippius-mem dashboard";
            if (e.status === 404) return "not found";
            const detail = e.detail ? ": " + e.detail : (e.message ? ": " + e.message : "");
            if (e.status) return "error " + e.status + detail;
            return "network error" + detail;
        }

        function vaultErrorText(e, name) {
            if (e.status === 401) return errorText(e);
            if (e.status === 404) return "unknown vault: " + name;
            const detail = e.detail ? ": " + e.detail : (e.message ? ": " + e.message : "");
            return "vault unavailable" + detail;
        }

        function showError(e) {
            const banner = byId("error-banner");
            banner.textContent = errorText(e);
            banner.hidden = false;
        }

        function clearError() {
            byId("error-banner").hidden = true;
        }

        // ---- Formatting ---------------------------------------------------------

        const TYPES = [
            ["decision", "Decision"], ["gotcha", "Gotcha"], ["convention", "Convention"],
            ["reference", "Reference"], ["context", "Context"],
        ];
        const KNOWN_TYPES = new Set(TYPES.map(([t]) => t));

        // The class that sets `--c` for a note type; unknown types stay neutral
        // rather than borrowing another type's color.
        function typeClass(t) {
            return "t-" + (KNOWN_TYPES.has(t) ? t : "other");
        }

        function typeChip(t) {
            return el("span", { class: "type " + typeClass(t), text: t || "unknown" });
        }

        function plural(n, word, many) {
            return n + " " + (n === 1 ? word : (many || word + "s"));
        }

        function fmtDate(ms) {
            const n = Number(ms);
            if (!n) return "—";
            const d = new Date(n);
            return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString();
        }

        // Compact age for the dense list column ("3d"); the inspector shows the
        // absolute timestamp.
        function fmtAge(ms) {
            const n = Number(ms);
            if (!n) return "—";
            const s = Math.floor((Date.now() - n) / 1000);
            if (s < 0) return "now";
            if (s < 60) return s + "s";
            const m = Math.floor(s / 60);
            if (m < 60) return m + "m";
            const h = Math.floor(m / 60);
            if (h < 24) return h + "h";
            const d = Math.floor(h / 24);
            if (d < 7) return d + "d";
            if (d < 30) return Math.floor(d / 7) + "w";
            if (d < 365) return Math.floor(d / 30) + "mo";
            return Math.floor(d / 365) + "y";
        }

        // SS58 addresses are 48 characters; the middle carries no meaning to a
        // reader, so the inspector shows both ends and keeps the full value in
        // the title for copying.
        function shortAddr(s) {
            return s && s.length > 16 ? s.slice(0, 6) + "…" + s.slice(-6) : (s || "—");
        }

        function describeWindow(w) {
            const days = Math.floor((w.until_ms - w.since_ms) / 86400000);
            if (days <= 1) return "24 hours";
            return days + " days";
        }

        // ---- State --------------------------------------------------------------

        // Everything the page shows derives from this one object; every loader
        // re-checks `state.vault` after its await so a vault switch mid-flight
        // cannot paint another vault's data.
        const state = {
            vaults: [],
            vault: null,
            all: [],          // every note row in the vault (overview) — stats + link titles
            repos: [],
            repo: null,       // null = all repos
            type: null,
            tag: null,
            q: "",
            rows: [],         // the list as served by /notes for the current filters
            total: 0,         // how many notes matched before the server's page cut
            listSeq: 0,       // generation counter: only the newest list request may paint
            sel: null,        // selected note id
            details: new Map(),
            histories: new Map(),
        };

        // ---- Routing ------------------------------------------------------------

        // `#/vault/<name>` opens a vault; `#/vault/<name>/repo/<repo>` scopes it to
        // one repo. Hash-based so back/forward and deep links work without a
        // server round-trip.
        function parseHash() {
            const raw = location.hash.replace(/^#/, "");
            let m = raw.match(/^\/vault\/([^/]+)\/repo\/(.+)$/);
            if (m) return { vault: decodeURIComponent(m[1]), repo: decodeURIComponent(m[2]) };
            m = raw.match(/^\/vault\/(.+)$/);
            if (m) return { vault: decodeURIComponent(m[1]), repo: null };
            return { vault: null, repo: null };
        }

        function routeTo(vault, repo) {
            let hash = "#/vault/" + encodeURIComponent(vault);
            if (repo) hash += "/repo/" + encodeURIComponent(repo);
            if (location.hash === hash) applyRoute();
            else location.hash = hash;
        }

        function applyRoute() {
            const route = parseHash();
            const fallback = state.vaults.find((v) => v.is_current) || state.vaults[0];
            const vault = route.vault || (fallback && fallback.name);
            if (!vault) {
                renderRail();
                setListStatus("empty", "No vaults configured. Run hippius-mem quickstart to create one.");
                return;
            }
            if (vault !== state.vault) {
                openVault(vault, route.repo);
            } else if (route.repo !== state.repo) {
                state.repo = route.repo;
                renderRail();
                renderStats();
                refreshList();
            }
        }

        // ---- Vault loading ------------------------------------------------------

        async function openVault(name, repo) {
            Object.assign(state, {
                vault: name, repo, type: null, tag: null, q: "", all: [], repos: [], rows: [], total: 0,
                sel: null,
            });
            state.listSeq++;
            state.details.clear();
            state.histories.clear();
            byId("q").value = "";
            clearError();
            renderRail();
            renderStats();
            renderReport(null);
            renderFilters();
            renderInspector();
            byId("mode-pill").hidden = true;
            byId("sync-pill").hidden = true;

            // The first open builds and syncs the vault's store server-side, which
            // can take seconds; every later request reuses it.
            setListStatus("loading", "Syncing " + name + "… the first open can take a few seconds.");
            try {
                const overview = await apiGet(vaultPath(name, "/overview"));
                if (state.vault !== name) return;
                state.all = overview.notes || [];
                setModePill(overview.semantic);
            } catch (e) {
                if (state.vault !== name) return;
                state.vault = null;
                renderRail();
                setListStatus("error", vaultErrorText(e, name) + ". Select the vault to retry.");
                return;
            }
            renderStats();
            loadRepos(name);
            loadReport(name);
            checkSync(name);
            refreshList();
        }

        async function loadRepos(name) {
            try {
                const data = await apiGet(vaultPath(name, "/repos"));
                if (state.vault !== name) return;
                state.repos = data.repos || [];
                renderRail();
            } catch (e) {
                if (state.vault === name) showError(e);
            }
        }

        // The report is secondary: a failure leaves its two panels in a quiet
        // "unavailable" state rather than blocking the list.
        async function loadReport(name) {
            try {
                const report = await apiGet(vaultPath(name, "/report"));
                if (state.vault === name) renderReport(report);
            } catch (_) {
                if (state.vault === name) renderReport({ unavailable: true });
            }
        }

        async function checkSync(name) {
            const pill = byId("sync-pill");
            pill.hidden = false;
            pill.disabled = true;
            pill.replaceChildren(el("span", { class: "dot busy" }), "Checking for new notes…");
            try {
                const h = await apiGet(vaultPath(name, "/health"));
                if (state.vault !== name) return;
                pill.title = "Check for teammates' new notes";
                setModePill(h.semantic);
                syncedAt = Date.now();
                pill.disabled = false;
                renderSyncPill();
                // A sync that pulled teammates' notes changes the corpus, so refresh
                // what was derived from it.
                if (h.synced) reloadCorpus(name);
            } catch (e) {
                if (state.vault !== name) return;
                syncedAt = null;
                pill.title = errorText(e);
                pill.replaceChildren(el("span", { class: "dot warn" }), "Sync check failed · retry");
            } finally {
                if (state.vault === name) pill.disabled = false;
            }
        }

        async function reloadCorpus(name) {
            try {
                const overview = await apiGet(vaultPath(name, "/overview"));
                if (state.vault !== name) return;
                state.all = overview.notes || [];
                state.details.clear();
                state.histories.clear();
                renderStats();
                renderInspector();
                loadRepos(name);
                loadReport(name);
                refreshList();
            } catch (e) {
                if (state.vault === name) showError(e);
            }
        }

        let syncedAt = null;

        function renderSyncPill() {
            const pill = byId("sync-pill");
            if (syncedAt === null || pill.disabled) return;
            const age = fmtAge(syncedAt);
            pill.replaceChildren(el("span", { class: "dot" }), "Synced ",
                el("b", { text: age === "now" || age.endsWith("s") ? "just now" : age + " ago" }));
        }

        function setModePill(semantic) {
            const pill = byId("mode-pill");
            pill.hidden = false;
            pill.title = semantic
                ? "Recall matches paraphrases with the local embedding model"
                : "This build ranks recall by keyword overlap only";
            pill.replaceChildren(el("span", { class: semantic ? "dot" : "dot off" }),
                el("b", { text: semantic ? "Semantic" : "Lexical" }), " recall");
        }

        // ---- Notes list ---------------------------------------------------------

        async function refreshList() {
            const name = state.vault;
            if (!name) return;
            const seq = ++state.listSeq;
            const params = { q: state.q, type: state.type, tag: state.tag, repo: state.repo };
            if (!state.rows.length) setListStatus("loading", "Loading notes…");
            try {
                const data = await apiGet(vaultPath(name, "/notes"), params);
                if (state.vault !== name || seq !== state.listSeq) return;
                state.rows = data.notes || [];
                state.total = data.total || state.rows.length;
            } catch (e) {
                if (state.vault !== name || seq !== state.listSeq) return;
                // The failure goes where the list would be, so the list never
                // claims an empty vault it could not load.
                state.rows = [];
                state.total = 0;
                renderFilters();
                setListStatus("error", errorText(e));
                return;
            }
            if (!state.rows.some((n) => n.id === state.sel)) {
                state.sel = state.rows.length ? state.rows[0].id : null;
                renderInspector();
            }
            renderFilters();
            renderRows();
        }

        function setListStatus(kind, msg) {
            const status = byId("list-status");
            status.className = "placeholder" + (kind === "error" ? " error" : "");
            status.replaceChildren();
            if (kind === "loading") status.append(el("span", { class: "spinner" }));
            status.append(el("span", { text: msg }));
            status.hidden = false;
            byId("notes-table").hidden = true;
        }

        function renderRows() {
            const list = byId("notes-table");
            list.replaceChildren();
            if (!state.rows.length) {
                const filtered = state.q || state.type || state.tag;
                setListStatus("empty", filtered
                    ? "No notes match. Clear a filter or try different words."
                    : "No notes here yet. Agents add them with the remember tool.");
                return;
            }
            byId("list-status").hidden = true;
            list.hidden = false;
            for (const n of state.rows) list.append(noteRow(n));
        }

        function noteRow(n) {
            const tags = (n.tags || []).map((t) => "#" + t).join(" ");
            const row = el("li", {
                class: "row " + typeClass(n.note_type), role: "option", tabindex: "-1",
                "aria-selected": String(n.id === state.sel), "data-id": n.id,
            },
                typeChip(n.note_type),
                el("span", { class: "sum" },
                    el("b", { text: n.summary }),
                    el("span", { text: tags ? n.id + " · " + tags : n.id })),
                el("span", { class: "repo-c", text: n.repo }),
                el("span", { class: "when", text: fmtAge(n.updated), title: fmtDate(n.updated) }));
            if (n.id === state.sel) row.tabIndex = 0;
            row.addEventListener("click", () => select(n.id));
            return row;
        }

        function select(id, { focus } = {}) {
            state.sel = id;
            for (const row of byId("notes-table").children) {
                const on = row.dataset.id === id;
                row.setAttribute("aria-selected", String(on));
                row.tabIndex = on ? 0 : -1;
                if (on) {
                    row.scrollIntoView({ block: "nearest" });
                    if (focus) row.focus();
                }
            }
            renderInspector();
        }

        function moveSelection(step) {
            if (!state.rows.length) return;
            const i = state.rows.findIndex((n) => n.id === state.sel);
            const next = state.rows[Math.min(state.rows.length - 1, Math.max(0, i + step))];
            select(next.id, { focus: true });
        }

        // ---- Rail ---------------------------------------------------------------

        function renderRail() {
            byId("vault-count").textContent = state.vaults.length || "";
            byId("vaults").replaceChildren(...state.vaults.map((v) => {
                const item = el("button", {
                    class: "nav-item vault", type: "button", "aria-current": String(v.name === state.vault),
                    title: v.orgs && v.orgs.length ? v.orgs.join(", ") + " · " + v.bucket : "catch-all · " + v.bucket,
                },
                    el("span", { class: "ic", text: v.name.slice(0, 1).toUpperCase() }),
                    el("span", { class: "nm", text: v.name }),
                    v.is_current ? el("span", { class: "tag-current", text: "This repo" }) : null);
                item.addEventListener("click", () => routeTo(v.name, null));
                return item;
            }));

            const total = state.all.length;
            const max = Math.max(1, ...state.repos.map((r) => r.count));
            byId("repo-count").textContent = state.repos.length || "";
            const items = [repoItem("All repos", total, null, max)];
            for (const r of state.repos) items.push(repoItem(r.repo, r.count, r.repo, max));
            byId("repos").replaceChildren(...(state.vault ? items : []));
        }

        function repoItem(label, count, key, max) {
            const item = el("button", {
                class: "nav-item repo", type: "button", "aria-current": String(state.repo === key),
            },
                el("span", { class: "ic", text: key === null ? "∗" : key === "global" ? "◎" : "#" }),
                el("span", { class: "nm", text: key === "global" ? "global · team-wide" : label }),
                el("span", { class: "ct", text: String(count) }));
            if (key !== null) {
                const fill = el("i");
                fill.style.width = (count / max) * 100 + "%";
                item.append(el("span", { class: "meter" }, fill));
            }
            item.addEventListener("click", () => routeTo(state.vault, key));
            return item;
        }

        // ---- Stats --------------------------------------------------------------

        function scoped() {
            return state.repo ? state.all.filter((n) => n.repo === state.repo) : state.all;
        }

        function typeCounts(notes) {
            const counts = new Map(TYPES.map(([t]) => [t, 0]));
            for (const n of notes) counts.set(n.note_type, (counts.get(n.note_type) || 0) + 1);
            return counts;
        }

        function renderStats() {
            const notes = scoped();
            const repoCount = new Set(state.all.map((n) => n.repo)).size;
            byId("total").replaceChildren(String(notes.length),
                el("small", { text: state.repo ? "in " + state.repo : "across " + plural(repoCount, "repo") }));

            const counts = typeCounts(notes);
            const bar = byId("type-bar");
            bar.replaceChildren();
            for (const [t, c] of counts) {
                if (!c) continue;
                const seg = el("i", { class: typeClass(t), title: t + ": " + c });
                seg.style.flex = String(c);
                bar.append(seg);
            }
            byId("type-legend").replaceChildren(...TYPES.map(([t, label]) =>
                el("span", { class: typeClass(t) }, el("i", { class: "sw" }), label + " ",
                    el("b", { text: String(counts.get(t) || 0) }))));
        }

        function renderReport(report) {
            const act = byId("act");
            const reuse = byId("reuse");
            if (!report || report.unavailable) {
                byId("act-window").textContent = "";
                const msg = report ? "Report unavailable" : "Loading…";
                act.replaceChildren(el("div", { class: "stat-empty", text: msg }));
                reuse.replaceChildren(el("div", { class: "stat-empty", text: msg }));
                return;
            }

            byId("act-window").textContent = "Last " + describeWindow(report.window);
            const a = report.activity;
            const metrics = [
                ["Added", a.added], ["Edited", a.edited], ["Linked", a.linked],
                ["Forgot", a.tombstoned], ["Redacted", a.redacted],
            ];
            const top = Math.max(1, ...metrics.map(([, v]) => v));
            act.replaceChildren(...metrics.map(([label, v]) => {
                const col = el("i", { class: v ? "col" : "col zero" });
                // Bars share one scale (the busiest kind fills 40px); a non-zero
                // count keeps 8px so it never reads as zero.
                col.style.height = (v ? Math.max(8, (v / top) * 40) : 2) + "px";
                return el("div", { title: label + ": " + v }, el("b", { text: String(v) }), col, el("span", { text: label }));
            }));

            if (!report.reuse.length) {
                reuse.replaceChildren(el("div", { class: "stat-empty", text: "No note has been reused by a teammate yet." }));
                return;
            }
            reuse.replaceChildren(...report.reuse.slice(0, 4).map((r) => {
                const n = r.distinct_reinforcers;
                const pips = el("span", { class: "pips", title: plural(n, "teammate") + " reused this" });
                for (let i = 1; i <= 5; i++) pips.append(el("i", { class: i <= n ? "on" : "" }));
                pips.append(el("b", { text: String(n) }));
                const btn = el("button", { type: "button" }, el("span", { class: "s", text: r.summary }), pips);
                btn.addEventListener("click", () => openNote(r.id));
                return btn;
            }));
        }

        // Open a note that may sit outside the current filters (a reuse leader, a
        // link): clear what would hide it, then select it.
        function openNote(id) {
            if (state.rows.some((n) => n.id === id)) {
                select(id);
                return;
            }
            const target = state.all.find((n) => n.id === id);
            Object.assign(state, { sel: id, q: "", type: null, tag: null });
            byId("q").value = "";
            renderInspector();
            if (target && state.repo && target.repo !== state.repo) routeTo(state.vault, null);
            else refreshList();
        }

        // ---- Filters ------------------------------------------------------------

        function renderFilters() {
            const counts = typeCounts(scoped());
            const chips = TYPES.map(([t, label]) => {
                const chip = el("button", {
                    class: "chip " + typeClass(t), type: "button", "aria-pressed": String(state.type === t),
                }, el("span", { class: "sw" }), label, el("span", { class: "n", text: String(counts.get(t) || 0) }));
                chip.addEventListener("click", () => {
                    state.type = state.type === t ? null : t;
                    refreshList();
                    renderFilters();
                });
                return chip;
            });
            if (state.tag) {
                const chip = el("button", {
                    class: "chip tag-chip", type: "button", "aria-pressed": "true", title: "Remove tag filter",
                }, "#" + state.tag + "  ×");
                chip.addEventListener("click", () => setTag(null));
                chips.push(chip);
            }
            const shown = state.rows.length;
            let count = shown + " of " + plural(scoped().length, "note");
            if (state.q) {
                count = state.total > shown
                    ? "top " + shown + " of " + plural(state.total, "match", "matches")
                    : plural(shown, "match", "matches");
                count += " · ranked by recall";
            }
            byId("filters").replaceChildren(...chips, el("span", { class: "spacer" }),
                el("span", { class: "count", text: state.vault ? count : "" }));
        }

        function setTag(tag) {
            state.tag = tag;
            refreshList();
            renderFilters();
        }

        // Debounce keystrokes so a fast typist issues one recall, not one per key.
        const SEARCH_DEBOUNCE_MS = 200;
        let searchTimer = null;
        function onSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                state.q = byId("q").value.trim();
                refreshList();
            }, SEARCH_DEBOUNCE_MS);
        }

        // ---- Inspector ----------------------------------------------------------

        async function renderInspector() {
            const insp = byId("insp");
            const id = state.sel;
            if (!id) {
                insp.className = "pane insp scroll";
                insp.replaceChildren(el("div", { class: "insp-empty", text: "Select a note to read it." }));
                return;
            }
            let detail = state.details.get(id);
            if (!detail) {
                insp.replaceChildren(el("div", { class: "insp-empty" }, el("span", { class: "spinner" })));
                const name = state.vault;
                try {
                    detail = await apiGet(notePath(name, id));
                } catch (e) {
                    if (state.sel !== id || state.vault !== name) return;
                    insp.replaceChildren(el("div", { class: "insp-empty", text: errorText(e) }));
                    return;
                }
                state.details.set(id, detail);
                if (state.sel !== id || state.vault !== name) return;
            }
            insp.className = "pane insp scroll " + typeClass(detail.note_type);
            byId("announce").textContent = "Showing: " + detail.summary;
            insp.replaceChildren(inspectorHead(detail), inspectorBody(detail));
            insp.scrollTop = 0;
        }

        function inspectorHead(d) {
            const meta = el("dl", { class: "meta" });
            const rows = [
                ["Repo", d.repo, d.repo],
                ["Author", shortAddr(d.author), d.author],
                ["Created", fmtDate(d.created)],
                ["Updated", fmtDate(d.updated)],
                ["Note id", d.id, d.id],
                ["Version", (d.version || "").slice(0, 16) + "…", d.version],
            ];
            for (const [k, v, full] of rows) {
                meta.append(el("dt", { text: k }), el("dd", full ? { text: v, title: full } : { text: v }));
            }
            return el("div", { class: "insp-head" }, typeChip(d.note_type), el("h2", { text: d.summary }), meta);
        }

        function inspectorBody(d) {
            const body = el("div", { class: "insp-body" }, el("p", { class: "prose", text: d.body || "(empty)" }));
            if (d.tags && d.tags.length) {
                body.append(el("div", { class: "tags" }, ...d.tags.map((t) => {
                    const b = el("button", { type: "button", title: "Show notes tagged " + t, text: "#" + t });
                    b.addEventListener("click", () => setTag(t));
                    return b;
                })));
            }
            body.append(historySection(d.id));
            return body;
        }

        function linksSection(links) {
            const byNote = new Map(state.all.map((n) => [n.id, n]));
            const cards = links.map((id) => {
                const n = byNote.get(id);
                const card = el("button", { class: "link-card " + typeClass(n && n.note_type), type: "button" },
                    el("i", { class: "sw" }),
                    el("span", {},
                        el("b", { text: n ? n.summary : id }),
                        el("span", { text: n ? n.repo + " · " + id : "not indexed on this machine" })));
                if (n) card.addEventListener("click", () => openNote(id));
                else card.disabled = true;
                return card;
            });
            return el("div", { class: "sec" }, el("span", { class: "label", text: "Linked notes" }),
                el("div", { class: "links" }, ...cards));
        }

        // Links and the audit trail come from one endpoint that re-reads and
        // re-verifies the WHOLE op-log server-side (seconds of gateway I/O), so it
        // loads only on request and is cached per note for the rest of the visit.
        function historySection(id) {
            const sec = el("div", { class: "sec" });
            const cached = state.histories.get(id);
            if (cached) {
                sec.append(historyChain(cached));
                return sec;
            }
            sec.append(el("span", { class: "label", text: "Links and audit trail" }));
            const btn = el("button", { class: "ghost", type: "button", text: "Load links and audit trail" });
            btn.addEventListener("click", async () => {
                btn.disabled = true;
                btn.textContent = "Verifying op-log…";
                const name = state.vault;
                try {
                    const h = await apiGet(notePath(name, id, "/history"));
                    state.histories.set(id, h);
                    if (state.vault !== name || !btn.isConnected) return;
                    sec.replaceChildren(historyChain(h));
                } catch (e) {
                    btn.disabled = false;
                    btn.textContent = "Load links and audit trail";
                    btn.after(el("div", { class: "flags", text: errorText(e) }));
                }
            });
            sec.append(btn);
            return sec;
        }

        function historyChain(h) {
            const wrap = el("div", { class: "insp-body-flush" });
            if (h.links && h.links.length) wrap.append(linksSection(h.links));
            const trail = el("div", { class: "sec" }, el("span", { class: "label", text: "Audit trail" }));
            wrap.append(trail);
            const flags = [];
            if (h.tombstoned) flags.push("forgotten");
            if (h.redacted) flags.push("redacted");
            if (flags.length) trail.append(el("div", { class: "flags", text: flags.join(" · ") }));
            const entries = h.entries || [];
            if (!entries.length) {
                trail.append(el("div", { class: "muted", text: "No recorded operations." }));
                return wrap;
            }
            trail.append(el("div", { class: "chain" }, ...entries.map((e) => el("div", { class: "op" },
                el("i", { class: e.anchored ? "node anchored" : "node" }),
                el("div", {},
                    el("b", { text: e.kind }),
                    el("span", { class: "who", text: shortAddr(e.author) + " · lamport " + e.lamport, title: e.author })),
                el("span", { class: e.anchored ? "st" : "st pending", text: e.anchored ? "Anchored" : "Pending" })))));
            return wrap;
        }

        // ---- Keyboard + boot ----------------------------------------------------

        function toggleGrid() {
            const overlay = byId("overlay");
            overlay.hidden = !overlay.hidden;
            byId("grid-toggle").setAttribute("aria-pressed", String(!overlay.hidden));
        }

        function onKey(e) {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.target.tagName === "INPUT") {
                if (e.key === "Escape") e.target.blur();
                if (e.key === "ArrowDown") { e.preventDefault(); moveSelection(0); }
                return;
            }
            if (e.key === "/") { e.preventDefault(); byId("q").focus(); }
            else if (e.key === "g" || e.key === "G") toggleGrid();
            else if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveSelection(1); }
            else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveSelection(-1); }
        }

        async function init() {
            byId("origin").textContent = location.host;
            byId("q").addEventListener("input", onSearch);
            byId("grid-toggle").addEventListener("click", toggleGrid);
            byId("sync-pill").addEventListener("click", () => { if (state.vault) checkSync(state.vault); });
            document.addEventListener("keydown", onKey);
            window.addEventListener("hashchange", applyRoute);
            setInterval(renderSyncPill, 30000);

            renderReport(null);
            renderInspector();
            setListStatus("loading", "Loading vaults…");
            try {
                state.vaults = await apiGet("/api/vaults");
            } catch (e) {
                setListStatus("error", errorText(e));
                return;
            }
            applyRoute();
        }

        init();
    </script>
</body>
</html>

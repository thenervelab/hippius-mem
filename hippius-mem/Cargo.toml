[package]
name = "hippius-mem"
version = "0.1.0"
edition = "2024"

[dependencies]
hippius-mem-core = { version = "0.1.0", path = "../hippius-mem-core" }
rmcp = { version = "1.8.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"

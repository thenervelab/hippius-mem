[package]
name = "hippius-mem"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
hex = "0.4.3"
hippius-mem-core = { version = "0.1.0", path = "../hippius-mem-core" }
rmcp = { version = "1.8.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Zero-on-drop for the decoded sr25519 signing seed, matching the seed-hygiene
# discipline hippius-mem-core already applies to key material.
zeroize = "1.9.0"

[features]
# Forwards to hippius-mem-core's `chain` feature so `build_store` can wire a
# `SubxtAnchor` to the configured `chain_ws_url`. Off by default: the binary then
# anchors with the local `NoopAnchor` and never pulls the heavy `subxt` stack.
chain = ["hippius-mem-core/chain"]
# Forwards to hippius-mem-core's `console` feature, enabling the `mint-token`
# subcommand (api.hippius.com S3 sub-token minting). Off by default so the binary
# never pulls reqwest/alloy.
console = ["hippius-mem-core/console"]
# Forwards to hippius-mem-core's `embeddings` feature so `build_store` can wire a
# `FastEmbedder` when `semantic_embeddings` is set. Off by default: the binary
# then uses the lexical `HashEmbedder` and never pulls the ONNX Runtime stack.
embeddings = ["hippius-mem-core/embeddings"]

[lints]
workspace = true

[dev-dependencies]
# `async-trait` lets the doctor tests implement a fault-injecting `BlobStore`
# fake (the trait is `#[async_trait]`). Pinned to the version the core crate
# already resolves, so no new entry enters the lockfile.
async-trait = "0.1.89"
proptest = "1.11.0"

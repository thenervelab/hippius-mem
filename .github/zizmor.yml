# zizmor config. release.yml is GENERATED AND OWNED by cargo-dist
# (`dist generate` overwrites it wholesale); the findings below are inherent
# to the cargo-dist 0.32.0 template and cannot be fixed in place. Each ignore
# is scoped to release.yml only — other workflows get full enforcement.
rules:
  # The template sets workflow-level `contents: write`, which dist needs to
  # create releases/tags. No dist config knob narrows the standard jobs'
  # permissions (github-custom-job-permissions only affects custom jobs).
  # Residual risk is limited: five of this file's six checkouts use
  # persist-credentials: false. The sixth is the one EXCEPTION —
  # publish-homebrew-formula's checkout of the EXTERNAL
  # thenervelab/homebrew-tap repo (release.yml:312, part of dist's own
  # generated template, added 2026-08-08 when publish-jobs = ["homebrew"]
  # was enabled) — sets persist-credentials: true, which is functionally
  # required: that job's later `git push` needs the credential to still be
  # on disk. It's safe because the credential isn't the runner's own
  # GITHUB_TOKEN: it's `token: ${{ secrets.HOMEBREW_TAP_TOKEN }}`, a PAT
  # deliberately scoped to push access on that one external tap repo only,
  # so persisting it can't be leveraged against this (private) repo. The
  # actual release publish uses the GH_RELEASES_TOKEN secret against the
  # public releases repo, not the runner token either.
  excessive-permissions:
    ignore:
      - release.yml
  # All template-injection findings expand either `github.ref_name` (the
  # pushed tag — only maintainers can push tags to this private repo) or
  # dist's own plan/host JSON output into run blocks. Both are trusted inputs
  # in this workflow's threat model; upstream tracks hardening of its
  # templates. Confidence on most findings is Low/Medium.
  #
  # BREADTH CAVEAT: this ignore is category-wide for release.yml, so a future
  # `dist generate` (e.g. after a cargo-dist upgrade) could introduce a NEW
  # injection sink that gets silently ignored. Mitigation: after every
  # cargo-dist upgrade, re-run `zizmor --no-config .github/workflows/release.yml`
  # and diff the findings against the recorded baseline of the 0.32.0 template:
  # 1 excessive-permissions + 8 template-injection + 1 unpinned-images +
  # 1 secrets-inherit findings (see below). Anything beyond that baseline is
  # new and must be reviewed, not assumed covered.
  template-injection:
    ignore:
      - release.yml

  # Confirmed by reading cargo-dist v0.32.0's schema (ContainerConfig in
  # cargo-dist-schema/src/lib.rs): `container` is `Option<...>`, default
  # None, only set via a per-target `[dist.github-custom-runners.<target>]`
  # sub-table. This workspace's only github-custom-runners entry
  # (aarch64-unknown-linux-gnu) is a bare runner-label string, not a
  # container sub-table, so `matrix.container` is unset for every target we
  # build and the `container: ${{ matrix.container && ... }}` line the
  # template always emits is dead at runtime. Surfaced 2026-08-08 when
  # `dist generate` was re-run to add the homebrew publish job (unrelated
  # line, unchanged by that diff) — zizmor 1.29.0 added this audit after the
  # baseline above was first recorded. Low confidence per zizmor's own
  # output.
  unpinned-images:
    ignore:
      - release.yml

  # The custom-cargo-deny job (release.yml:175) calls the in-repo reusable
  # workflow .github/workflows/cargo-deny.yml with `secrets: inherit` — the
  # cargo-dist 0.32.0 template hardcodes that for every custom job, with no
  # config knob to narrow it. Safe here because the called workflow lives in
  # THIS repo (reviewed alongside this config, `permissions: contents: read`)
  # and uses no secrets at all: inheriting them hands the job nothing it can
  # reach for. Re-check this reasoning if cargo-deny.yml ever grows a secret
  # or the custom-job list grows a workflow that does.
  secrets-inherit:
    ignore:
      - release.yml

  # scheduled-failure-issue.yml uses workflow_run on purpose: a listener sees
  # a whole run's conclusion, so no per-workflow `needs:` list has to name
  # every job to keep a red scheduled run reportable. The audit's concern is
  # a workflow that checks out or executes code from a (possibly forked)
  # triggering run under base-repo permissions. This one performs no
  # checkout, runs nothing from the triggering run, gates on
  # event == 'schedule' (default branch only), reads only name / html_url /
  # event / conclusion from the payload into env (never into a run block),
  # and holds issues:write on that single job. Re-check this reasoning if
  # the file ever gains a checkout or an artifact download.
  dangerous-triggers:
    ignore:
      - scheduled-failure-issue.yml

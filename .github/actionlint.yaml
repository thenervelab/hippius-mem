# actionlint config. release.yml is GENERATED AND OWNED by cargo-dist
# (`dist generate` overwrites it wholesale), so its findings cannot be fixed
# in place — hand-edits are lost on the next regeneration. The ignores below
# are scoped to that file and to the exact findings observed against the
# cargo-dist 0.32.0 template; anything new will still fail the lint.
paths:
  .github/workflows/release.yml:
    ignore:
      # SC2086 (unquoted $RUNNER_TEMP / $GITHUB_PATH expansions) and SC2129
      # (style: individual >> redirects) are in dist's template scripts. The
      # expansions are runner-controlled paths without spaces, not user input.
      - 'shellcheck reported issue in this script: SC2086:'
      - 'shellcheck reported issue in this script: SC2129:'
      # SC2001 (style: prefer ${var//search/replace} over `sed`) is in dist's
      # publish-homebrew-formula job template (added when publish-jobs =
      # ["homebrew"] was enabled on 2026-08-08), stripping the `.rb`
      # extension off a formula filename. Style-only; not a functional bug.
      - 'shellcheck reported issue in this script: SC2001:'

[package]
name = "hippius-mem-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
aws-credential-types = "1.2.14"
aws-sdk-s3 = "1.137"
blake3 = "1.8.5"
chacha20poly1305 = "0.10.1"
schnorrkel = "0.11.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
# Only the async `Mutex` is needed (feature `sync`): `MemoryStore`'s writer lock
# is held ACROSS `oplog.append().await` to make mint -> append -> advance atomic,
# which a `std::sync::Mutex` guard cannot do soundly (it is `!Send`, axiom
# `rust_quality_74`). The runtime/macros stay in dev-deps; production only needs
# the lock primitive.
tokio = { version = "1.52.3", features = ["sync"] }
tracing = "0.1.44"
ulid = { version = "1.2.1", features = ["serde"] }
zeroize = "1.9.0"

# On-chain anchoring stack — pulled in ONLY by the `chain` feature (`dep:` keeps
# the optional crate from leaking an implicit same-named feature). The default
# build must not compile the heavy `subxt` tree, so these stay optional.
subxt = { version = "0.50.1", optional = true }
subxt-signer = { version = "0.50.1", optional = true }
bip39 = "2"
blake2 = "0.10"
bs58 = "0.5"
pbkdf2 = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# api.hippius.com sub-token minting stack — pulled in ONLY by the `console`
# feature. `dep:` in the feature list keeps each optional crate from leaking an
# implicit same-named feature, and the heavy async-HTTP + ETH-signing trees stay
# out of the default build (verified: a default `cargo tree` shows none of them).
# reqwest is rustls-only (no OpenSSL) and async; alloy-signer-local derives the
# ETH key from the mnemonic (EIP-191 signing); hex renders the 65-byte signature.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
alloy-signer = { version = "2.1.0", optional = true }
alloy-signer-local = { version = "2.1.0", features = ["mnemonic"], optional = true }
hex = { version = "0.4", optional = true }

[features]
# Compiles the `S3BlobStore` live round-trip test. Off by default so CI builds
# and runs the unit suite (in-memory fake, no network); on, the test compiles
# but stays `#[ignore]`d — it needs a real gateway endpoint + sub-token creds.
s3-integration = []
# Compiles `SubxtAnchor`, which anchors Merkle roots on the Hippius chain via a
# signed `System::remark_with_event`. Off by default so neither the library nor
# CI pulls `subxt`; live submission needs a funded account + reachable node.
chain = ["dep:subxt", "dep:subxt-signer"]
# Compiles the `ConsoleClient` (api.hippius.com sub-token minting) and the
# `eth_signer_from_mnemonic` ETH-key derivation. Off by default so neither the
# library nor CI pulls reqwest/alloy; minting needs a network + a real mnemonic.
console = ["dep:reqwest", "dep:alloy-signer", "dep:alloy-signer-local", "dep:hex"]

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
# Offline S3 testing: drive `S3BlobStore` against a mocked client with no
# network. `test-util` on aws-sdk-s3 is a dev-only feature addition (unioned with
# the production dependency for test builds), enabling `with_test_defaults_v2`.
aws-smithy-mocks = "0.2.6"
aws-sdk-s3 = { version = "1.137", features = ["test-util"] }
hex = "0.4"
# Drives the `console`-gated `mint_sub_token` 3-step flow against canned HTTP
# responses with no network. Only used by `#[cfg(feature = "console")]` tests; a
# default `cargo build` never compiles it (dev-deps are test-only).
wiremock = "0.6"
